<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>양자물리 놀이터 · 둘째 권</title>
<meta property="og:title" content="양자물리 놀이터 · 둘째 권">
<meta property="og:description" content="코스모스, 우주 주소, 지구 자석, 화성은 왜 빨갈까, 해가 빛나는 비밀, 얼마나 모여야 별이 켜질까를 동화와 3D 영상으로">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--ink:#23324a;--sub:#5b6b82;--bg:#eef4ff;--card:#fff;--accent:#2563eb;--accent2:#93c5fd;--ok:#22a861;--okbg:#e8f8ef;--no:#e5484d;--nobg:#fdecec;--line:#dbe3ee;--lv:#1d4ed8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Jua',system-ui,'Malgun Gothic',sans-serif}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px}
h1{margin:0;font-size:24px;font-weight:400}
.lv{background:var(--lv);color:#fff;padding:4px 12px;border-radius:999px;font-size:15px}
.booklink{font-size:15px;color:var(--accent);text-decoration:none;background:#fff;border-radius:999px;padding:4px 12px;box-shadow:0 2px 0 #0001}
#stars{margin-left:auto;font-size:20px}
#dots{display:flex;gap:6px;flex-wrap:wrap;width:100%}
#dots button{width:38px;height:38px;border-radius:50%;border:3px solid var(--line);background:#fff;font:inherit;font-size:16px;color:var(--ink);cursor:pointer}
#dots button.on{border-color:var(--accent);background:var(--accent);color:#fff}
main{display:grid;gap:16px;padding:0 16px 16px}
@media(min-width:900px){
  main{grid-template-columns:1.35fr 1fr;height:calc(100vh - 120px);min-height:580px}
  #stage{min-height:0!important}
}
#stage{position:relative;min-height:55vh;border-radius:28px;overflow:hidden;background:#dde9ff}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.tools{position:absolute;top:10px;right:10px;display:flex;gap:6px}
.tools button,.tbtn{font:inherit;font-size:16px;padding:8px 14px;border-radius:999px;border:0;background:#fffe;color:var(--ink);box-shadow:0 2px 0 #0002;cursor:pointer}
.tbtn[aria-pressed=true]{background:var(--accent);color:#fff}
/* 돋보기(확대) 칩 */
#spots{position:absolute;top:10px;left:10px;right:110px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
#spots button{pointer-events:auto;font:inherit;font-size:16px;padding:7px 12px;border-radius:999px;border:3px solid #fff;background:#fff8d6;color:#7a4a00;box-shadow:0 2px 0 #0002;cursor:pointer}
#spots button.on{background:#f59e0b;color:#fff;border-color:#fde68a}
#spots button.all{background:#fff;color:var(--ink)}
/* 영상 조작 막대 */
#player{position:absolute;left:10px;right:10px;bottom:10px;display:flex;align-items:center;gap:6px;background:#ffffffe8;border-radius:999px;padding:5px 8px;box-shadow:0 3px 10px #0002}
#player button{font:inherit;font-size:16px;min-width:44px;height:40px;padding:0 10px;border-radius:999px;border:0;background:#f1f5f9;color:var(--ink);cursor:pointer;white-space:nowrap}
#player button.main{background:var(--accent);color:#fff;min-width:52px}
#player button[aria-pressed=true]{background:#fde68a}
#seek{flex:1;min-width:40px;accent-color:var(--accent);height:28px}
#ptime{font-size:14px;color:var(--sub);min-width:34px;text-align:right}
.hint{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);background:#fffd;padding:6px 14px;border-radius:999px;font-size:15px;pointer-events:none;transition:opacity .6s;white-space:nowrap}
.card{background:var(--card);border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 0 #0000000f;overflow:auto}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{background:#ede9fe;color:#5b21b6;padding:5px 14px;border-radius:999px;font-size:16px}
h2{margin:0;font-size:30px;font-weight:400}
.story{margin:0;font-size:20px;line-height:1.5;color:var(--sub)}
.steps{display:flex;gap:8px;font-size:15px;flex-wrap:wrap}
.steps span{padding:3px 12px;border-radius:999px;background:#f1f5f9;color:#94a3b8}
.steps span.on{background:var(--accent);color:#fff}
.steps span.done{background:var(--okbg);color:var(--ok)}
.q{margin:0;font-size:25px;line-height:1.4}
#choices{display:grid;gap:10px}
#choices button{display:flex;align-items:center;gap:12px;min-height:64px;padding:12px 16px;border-radius:20px;border:3px solid var(--line);background:#fff;font:inherit;font-size:23px;color:var(--ink);text-align:left;cursor:pointer;transition:transform .1s}
#choices button:hover:not(:disabled){border-color:var(--accent);transform:translateY(-2px)}
#choices button .emo{font-size:30px;width:40px;text-align:center}
#choices button.right{border-color:var(--ok);background:var(--okbg)}
#choices button.wrong{border-color:var(--no);background:var(--nobg);opacity:.65;animation:shake .4s}
#choices button:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
#tip{margin:0;font-size:20px;color:#b4500a;min-height:1em}
#feedback{background:var(--okbg);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
#feedback[hidden]{display:none}
#feedback .yay{font-size:26px;color:var(--ok)}
#feedback .big{font-size:24px;line-height:1.45}
.pbtn{font:inherit;font-size:22px;padding:12px 20px;border-radius:18px;border:0;background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 4px 0 #0003}
.sbtn{font:inherit;font-size:20px;padding:11px 16px;border-radius:18px;border:3px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.sbtn:disabled{opacity:.4;cursor:default}
.mode{display:none;flex-direction:column;gap:12px}
.mode.on{display:flex}
.ldots{display:flex;gap:8px;align-items:center}
.ldots span{width:14px;height:14px;border-radius:50%;background:var(--line)}
.ldots span.on{background:var(--accent)}
.ldots span.done{background:var(--ok)}
.ldots span.q{border-radius:4px;width:22px}
.ldots em{font-style:normal;font-size:15px;color:var(--sub);margin-left:6px}
#wtext{margin:0;font-size:31px;line-height:1.4;min-height:2.8em}
.look{margin:0;font-size:18px;color:#7a4a00;background:#fff8d6;border-radius:14px;padding:8px 14px}
#ntext{margin:0;font-size:34px;line-height:1.4}
#ntext .term{display:inline-block;background:#fef3c7;color:#92400e;border:3px solid #f59e0b;border-radius:16px;padding:2px 16px;font-size:40px}
#ntext .formal{display:block;margin-top:6px;font-size:18px;color:var(--sub)}
#nsub{margin:0;font-size:21px;color:var(--sub);line-height:1.5}
#nsub .habit{display:block;margin-top:10px;background:#ecfdf5;color:#065f46;border:2px solid #a7f3d0;border-radius:14px;padding:8px 14px;font-size:20px}
#adult{margin:0;font-size:14px;color:var(--sub);font-family:system-ui,'Malgun Gothic',sans-serif;line-height:1.5}
nav{display:flex;justify-content:space-between;gap:10px;margin-top:auto}
nav button{font:inherit;font-size:21px;padding:12px 22px;border-radius:18px;border:3px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
nav button.go{border-color:var(--accent);background:var(--accent);color:#fff}
button:focus-visible{outline:4px solid #2b7fff;outline-offset:2px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-size:17px;z-index:20}
#toast[hidden]{display:none}

@media(max-width:899px){
  header{padding:8px 12px;gap:8px}
  h1{font-size:20px}
  .lv{font-size:13px}
  #stars{font-size:17px}
  #dots{gap:4px}
  #dots button{width:30px;height:30px;font-size:13px;border-width:2px}
  main{padding:0 10px 12px;gap:10px}
  #stage{position:sticky;top:0;z-index:5;height:46vh;height:46svh;min-height:280px;border-radius:20px;box-shadow:0 6px 12px #23324a22}
  .tools{top:6px;right:6px}
  .tools button{font-size:13px;padding:6px 10px}
  #spots{top:6px;left:6px;right:84px;gap:4px}
  #spots button{font-size:13px;padding:4px 9px;border-width:2px}
  #player{left:6px;right:6px;bottom:6px;gap:4px;padding:4px 6px}
  #player button{font-size:13px;min-width:36px;height:34px;padding:0 7px}
  #player button.main{min-width:42px}
  #ptime{display:none}
  .hint{font-size:12px;padding:5px 10px;bottom:48px}
  .card{padding:16px;border-radius:20px;gap:10px}
  h2{font-size:23px}
  .story{font-size:17px}
  .q{font-size:21px}
  #choices button{min-height:52px;font-size:19px;padding:10px 12px;border-radius:16px}
  #choices button .emo{font-size:24px;width:32px}
  #tip{font-size:17px}
  #feedback .yay{font-size:22px}
  #feedback .big{font-size:20px}
  .pbtn{font-size:19px;padding:10px 16px}
  .sbtn{font-size:17px;padding:9px 12px}
  #wtext{font-size:23px;min-height:2.6em}
  .look{font-size:15px}
  #ntext{font-size:25px}
  #ntext .term{font-size:29px;padding:2px 12px}
  #nsub{font-size:18px}
  nav button{font-size:18px;padding:10px 16px}
}
</style>
</head>
<body>
<header>
  <h1>⚛️ 양자물리 놀이터</h1>
  <span class="lv">둘째 권 · 우주와 지구</span>
  <a class="booklink" href="./">📚 책 고르기</a>
  <span id="stars" aria-live="polite">⭐ 0</span>
  <div id="dots" role="tablist" aria-label="이야기"></div>
</header>
<main>
  <section id="stage" aria-label="움직이는 3D 화면">
    <div id="spots" aria-label="돋보기"></div>
    <div class="tools"><button id="homeBtn">🎯 제자리</button></div>
    <div class="hint" id="hint">🔍 돋보기를 누르면 크게 · 끌면 돌아가요</div>
    <div id="player" aria-label="영상 조작">
      <button id="playBtn" class="main" aria-label="멈춤">⏸</button>
      <button id="restartBtn" aria-label="처음부터">⏮</button>
      <button id="speedBtn" aria-label="빠르기">🐇 보통</button>
      <input id="seek" type="range" min="0" max="1000" value="0" aria-label="장면 위치">
      <span id="ptime">0초</span>
    </div>
  </section>
  <section class="card">
    <div class="row">
      <span class="badge" id="badge"></span>
      <button class="tbtn" id="voiceBtn" aria-pressed="false">🔊 읽어 주기</button>
    </div>
    <h2 id="title"></h2>
    <!-- ① 보기 -->
    <div id="watch" class="mode">
      <div class="ldots" id="wdots"></div>
      <p class="story" id="story"></p>
      <p id="wtext"></p>
      <p class="look" id="look"></p>
      <div class="row"><button class="sbtn" id="wprevBtn">◀ 앞 장면</button><button class="pbtn" id="wnextBtn">다음 장면 ▶</button></div>
    </div>
    <!-- ② 문제 -->
    <div id="quiz" class="mode">
      <div class="steps"><span id="st1">① 무엇을 봤나요?</span><span id="st2">② 왜 그럴까?</span></div>
      <p class="q" id="q"></p>
      <div id="choices"></div>
      <p id="tip" aria-live="polite"></p>
      <div id="feedback" hidden aria-live="polite">
        <div class="yay">🎉 딩동댕! 둘 다 맞았어요</div>
        <p class="big" id="kid"></p>
        <div><button class="pbtn" id="nameBtn">🏷️ 이름 알아보기</button></div>
      </div>
      <div class="row"><button class="sbtn" id="rewatchBtn">🎬 영상 다시 보기</button></div>
    </div>
    <!-- ③ 이름표 -->
    <div id="name" class="mode">
      <p id="ntext"></p>
      <p id="nsub"></p>
      <p id="adult"></p>
      <div class="row"><button class="sbtn" id="againBtn">🎬 처음부터 다시 보기</button><button class="pbtn" id="nnextBtn">다음 이야기 ▶</button></div>
    </div>
    <nav>
      <button id="prevBtn">◀ 이전</button>
      <button id="nextBtn">다음 ▶</button>
    </nav>
  </section>
</main>
<div id="toast" hidden></div>
<script>

// ── 손가락 회전/확대 + 돋보기(부드럽게 다가가기·따라가기) ──
class TouchOrbit {
  constructor(cam, el) {
    this.cam = cam; this.target = new THREE.Vector3(); this.sph = new THREE.Spherical();
    this.minDistance = 1.2; this.maxDistance = 40; this.pts = new Map(); this.anim = null; this.follow = null;
    el.addEventListener('pointerdown', e => { el.setPointerCapture?.(e.pointerId); this.pts.set(e.pointerId, [e.clientX, e.clientY]); this.onUser?.(); });
    el.addEventListener('pointermove', e => {
      if (!this.pts.has(e.pointerId)) return;
      const [px, py] = this.pts.get(e.pointerId);
      if (this.pts.size === 1) {
        this.sph.theta -= (e.clientX - px) * .008;
        this.sph.phi = Math.min(Math.PI - .15, Math.max(.15, this.sph.phi - (e.clientY - py) * .008));
        this.pts.set(e.pointerId, [e.clientX, e.clientY]);
      } else {
        const before = [...this.pts.values()], d0 = Math.hypot(before[0][0] - before[1][0], before[0][1] - before[1][1]);
        this.pts.set(e.pointerId, [e.clientX, e.clientY]);
        const after = [...this.pts.values()], d1 = Math.hypot(after[0][0] - after[1][0], after[0][1] - after[1][1]);
        if (d0 > 0 && d1 > 0) this.sph.radius = Math.min(this.maxDistance, Math.max(this.minDistance, this.sph.radius * d0 / d1));
        this.anim = null;
      }
      this.apply();
    });
    const up = e => this.pts.delete(e.pointerId);
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('pointerleave', up);
    el.addEventListener('wheel', e => { e.preventDefault(); this.anim = null; this.sph.radius = Math.min(this.maxDistance, Math.max(this.minDistance, this.sph.radius * (1 + e.deltaY * .001))); this.apply(); }, { passive: false });
  }
  sync() { this.sph.setFromVector3(this.cam.position.clone().sub(this.target)); this.apply(); }
  apply() { this.cam.position.setFromSpherical(this.sph).add(this.target); this.cam.lookAt(this.target); }
  // to: Vector3 | Object3D | () => Vector3, r: 거리, dir: [theta, phi] (선택)
  goTo(to, r, dur = .7, dir = null) {
    const get = typeof to === 'function' ? to : to?.isObject3D ? () => to.getWorldPosition(new THREE.Vector3()) : (v => () => v.clone())(Array.isArray(to) ? new THREE.Vector3(...to) : to);
    this.follow = (typeof to === 'function' || to?.isObject3D) ? get : null;
    this.anim = { t: 0, dur, t0: this.target.clone(), r0: this.sph.radius, r1: r, get, th0: this.sph.theta, ph0: this.sph.phi, th1: dir ? dir[0] : this.sph.theta, ph1: dir ? dir[1] : this.sph.phi };
  }
  update(dt) {
    const a = this.anim;
    if (a) {
      a.t = Math.min(a.dur, a.t + dt); const k = ease(a.t / a.dur);
      this.target.lerpVectors(a.t0, a.get(), k); this.sph.radius = lerp(a.r0, a.r1, k);
      this.sph.theta = lerp(a.th0, a.th1, k); this.sph.phi = lerp(a.ph0, a.ph1, k);
      if (a.t >= a.dur) this.anim = null;
      this.apply(); return;
    }
    if (this.follow) { this.target.lerp(this.follow(), Math.min(1, dt * 8)); this.apply(); }
  }
}

// ── 기본 도우미 ──
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const ease = t => (t = clamp(t, 0, 1), t * t * (3 - 2 * t));
const lerp = (a, b, t) => a + (b - a) * t;
const pulse = t => 1 + .12 * Math.sin(t * 6);
const seg = (t, a, b) => ease((t - a) / (b - a));           // a~b초 사이 0→1
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const mat = c => new THREE.MeshStandardMaterial({ color: c, roughness: .5 });
const emat = (c, k = .6) => new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: k, roughness: .4 });
const tmat = (c, o = .35) => new THREE.MeshStandardMaterial({ color: c, transparent: true, opacity: o, roughness: .4, depthWrite: false });
function mesh(geo, c, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, c.isMaterial ? c : mat(c));
  m.position.set(x, y, z); return m;
}
const box = (w, h, d, c, x, y, z) => mesh(new THREE.BoxGeometry(w, h, d), c, x, y, z);
const ball = (r, c, x, y, z) => mesh(new THREE.SphereGeometry(r, 24, 14), c, x, y, z);
const cyl = (rt, rb, h, c, x, y, z) => mesh(new THREE.CylinderGeometry(rt, rb, h, 20), c, x, y, z);
const hideAll = (...o) => o.forEach(x => x && (x.visible = false));
const showAll = (...o) => o.forEach(x => x && (x.visible = true));

// 글자 스프라이트: 글자 길이에 맞춰 폭이 늘어나요. size = 글자 높이(월드 단위)
function label(text, size = .45, color = '#fff', stroke = '#23324acc') {
  size *= (globalThis.LABEL_K || 1); // 폰처럼 좁은 화면이면 글자를 키워요
  const cv = document.createElement('canvas'), x = cv.getContext('2d'), F = "78px Jua, 'Malgun Gothic', sans-serif";
  x.font = F; const w = Math.ceil(x.measureText(text).width) + 40;
  cv.width = Math.max(128, w); cv.height = 128;
  x.font = F; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.lineWidth = 14; x.lineJoin = 'round'; x.strokeStyle = stroke; x.strokeText(text, cv.width / 2, 68);
  x.fillStyle = color; x.fillText(text, cv.width / 2, 68);

}
const setOpacity = (o, k) => o.traverse(m => { if (m.material) { m.material.transparent = true; m.material.opacity = k; } });

// 화살표: 원점이 꼬리, 기본은 아래(-y). rotation.z = π/2 → 오른쪽, -π/2 → 왼쪽, π → 위

// 원기둥 막대를 두 점 사이에 놓기 (막대는 높이 1짜리로 만들어 두기)
const _up = new THREE.Vector3(0, 1, 0), _d = new THREE.Vector3();

// 별 반짝이 배경 (우주 장면용)
function starField(n = 400, R = 30, c = '#ffffff') {
  const pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { const v = new THREE.Vector3().randomDirection().multiplyScalar(R * (.6 + .4 * Math.random())); pos.set([v.x, v.y, v.z], i * 3); }
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  return new THREE.Points(geo, new THREE.PointsMaterial({ color: c, size: .12 }));
}
// 점구름 (전자 구름, 물방울 안개 등). spread(i) → Vector3
function dotCloud(n, spread, c = '#60a5fa', size = .06, o = .8) {
  const pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { const v = spread(i); pos.set([v.x, v.y, v.z], i * 3); }
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  return new THREE.Points(geo, new THREE.PointsMaterial({ color: c, size, transparent: true, opacity: o, depthWrite: false }));
}
// 정규분포 난수 (전자 구름 퍼짐)
const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };

// ── 눈 달린 친구(효소·단백질·원자 캐릭터) ──
// critter(반지름, 색) → 그룹. 앞(+z)을 봐요. g.userData.body 를 흔들면 살아 있는 느낌.
function critter(r, c, { eyes = true, smile = true, squash = .85, eyeY = .22 } = {}) {
  const g = new THREE.Group(), body = new THREE.Group();
  const b = ball(r, c); b.scale.set(1, squash, 1); body.add(b);
  if (eyes) for (const s of [-1, 1]) {
    const ez = Math.sqrt(Math.max(.05, 1 - eyeY * eyeY)) * squash, w = ball(r * .22, '#ffffff', s * r * .33, r * eyeY * squash, r * ez * .92), p = ball(r * .11, '#1f2937', s * r * .33, r * eyeY * squash, r * (ez * .92 + .18));
    body.add(w, p);
  }
  if (smile) { const my = eyeY > .4 ? eyeY - .25 : -.05, mz = Math.sqrt(Math.max(.05, 1 - my * my)) * squash; const m = mesh(new THREE.TorusGeometry(r * .18, r * .04, 8, 16, Math.PI), '#1f2937', 0, r * my * squash, r * mz * .95); m.rotation.z = Math.PI; body.add(m); }

}
const wobble = (g, t, k = 1) => { const b = g.userData.body || g; b.scale.set(1 + .05 * k * Math.sin(t * 7), 1 - .05 * k * Math.sin(t * 7), 1); };

// ════════ 생물: DNA · RNA ════════
// 염기 색: A 빨강, T 노랑, G 초록, C 파랑, U(RNA) 주황
const BASE = { A: '#ef4444', T: '#facc15', G: '#22c55e', C: '#3b82f6', U: '#fb923c' };
const PAIR = { A: 'T', T: 'A', G: 'C', C: 'G' };
const RPAIR = { A: 'U', T: 'A', G: 'C', C: 'G' };   // DNA 글자 → RNA 짝
const randSeq = (n, seed = 1) => { let s = seed; return Array.from({ length: n }, () => 'ATGC'[(s = (s * 9301 + 49297) % 233280) % 4]).join(''); };

// dnaModel(seq) : x축으로 누운 이중나선. 매 프레임 dna.update(돌림각, i => 벌어짐 0~1)
//  - bp[i].off (Vector3) 로 조각을 옮길 수 있고 (offA/offB 는 위/아래 가닥만), hideA/hideB 로 한 가닥만 숨기기, bp[i].cut = true 면 i와 i+1 사이 뼈대가 끊겨요.
//  - dna.posA(i)/posB(i): 현재 두 뼈대 구슬 위치, dna.x(i): i번째 칸의 x
function dnaModel(seq, o = {}) {
  const { rise = .34, R = .55, perTurn = 10, c1 = '#a78bfa', c2 = '#38bdf8', br = .1, gap = .9, x0 = null } = o;
  const g = new THREE.Group(), n = seq.length, bp = [];
  const sg = new THREE.SphereGeometry(br, 14, 10), rg = new THREE.CylinderGeometry(.065, .065, 1, 10), cg = new THREE.CylinderGeometry(.045, .045, 1, 8);
  const m1 = mat(c1), m2 = mat(c2), mb = {}; for (const k in BASE) mb[k] = mat(BASE[k]);
  const start = x0 ?? -(n - 1) * rise / 2;
  for (let i = 0; i < n; i++) {
    const s = seq[i], p = PAIR[s] || 'A';
    const a = new THREE.Mesh(sg, m1), b = new THREE.Mesh(sg, m2), ra = new THREE.Mesh(rg, mb[s]), rb = new THREE.Mesh(rg, mb[p]);
    const ca = new THREE.Mesh(cg, m1), cb = new THREE.Mesh(cg, m2);
    g.add(a, b, ra, rb, ca, cb); bp.push({ a, b, ra, rb, ca, cb, base: s, pair: p, off: new THREE.Vector3(), offA: new THREE.Vector3(), offB: new THREE.Vector3(), cut: false, hide: false });
  }
  const PA = [], PB = []; for (let i = 0; i < n; i++) { PA.push(V()); PB.push(V()); }
  const api = {
    group: g, bp, n, seq, rise, R,
    x: i => start + i * rise,
    posA: i => g.localToWorld(PA[i].clone()), posB: i => g.localToWorld(PB[i].clone()),
    localA: i => PA[i], localB: i => PB[i],
    update(spin = 0, openFn = null) {
      for (let i = 0; i < n; i++) {
        const B = bp[i], o = ease(openFn ? openFn(i) : 0), th = i * 2 * Math.PI / perTurn + spin, x = start + i * rise;
        PA[i].set(x, lerp(R * Math.cos(th), gap, o), lerp(R * Math.sin(th), 0, o)).add(B.off).add(B.offA);
        PB[i].set(x, lerp(-R * Math.cos(th), -gap, o), lerp(-R * Math.sin(th), 0, o)).add(B.off).add(B.offB);
        const mid = V(x, 0, 0).add(B.off), L = .42;
        const ea = mid.clone().lerp(PA[i].clone().add(V(0, -L, 0)), o), eb = mid.clone().add(B.offB).lerp(PB[i].clone().add(V(0, L, 0)), o);
        if (o < .01) eb.copy(ea);
        B.a.position.copy(PA[i]); B.b.position.copy(PB[i]);
        stick(B.ra, PA[i], ea); stick(B.rb, PB[i], eb);
        for (const m of [B.a, B.b, B.ra, B.rb]) m.visible = !B.hide;
        B.rb.visible = B.b.visible = !B.hide && !B.hideB;
        B.ra.visible = B.a.visible = !B.hide && !B.hideA;
      }
      for (let i = 0; i < n; i++) {
        const B = bp[i], ok = i < n - 1 && !B.cut && !B.hide && !bp[i + 1].hide;
        B.ca.visible = ok && !B.hideA && !bp[i + 1]?.hideA; B.cb.visible = ok && !B.hideB && !bp[i + 1]?.hideB && !B.cutB;
        if (ok) { stick(B.ca, PA[i], PA[i + 1]); stick(B.cb, PB[i], PB[i + 1]); }
      }
    },
  };
  api.update(0);
  return api;
}

// beadChain(글자들) : 구슬 사슬 (RNA, 아미노산 줄, 고분자 등). 매 프레임 chain.place(i => ({p, d, v}))
//  p: 구슬 위치, d: 염기 막대 방향(없으면 막대 숨김), v: 보임 여부
function beadChain(seq, o = {}) {
  const { color = '#fb923c', br = .1, stubLen = .42, colors = BASE, link = .045 } = o;
  const g = new THREE.Group(), n = seq.length, items = [];
  const sg = new THREE.SphereGeometry(br, 14, 10), rg = new THREE.CylinderGeometry(.065, .065, 1, 10), cg = new THREE.CylinderGeometry(link, link, 1, 8);
  const mbk = mat(color);
  for (let i = 0; i < n; i++) {
    const c = typeof colors === 'string' ? colors : (colors[seq[i]] || color);
    const bead = new THREE.Mesh(sg, o.beadColors ? mat(c) : mbk), stub = new THREE.Mesh(rg, mat(c)), con = new THREE.Mesh(cg, mbk);
    g.add(bead, stub, con); items.push({ bead, stub, con, base: seq[i], p: V(), v: false });
  }
  return {
    group: g, items, n,
    place(fn) {
      for (let i = 0; i < n; i++) {
        const it = items[i], r = fn(i) || { v: false };
        it.v = r.v !== false && !!r.p; it.bead.visible = it.v;
        if (!it.v) { it.stub.visible = false; continue; }
        it.p.copy(r.p); it.bead.position.copy(r.p);
        if (r.d) { it.stub.visible = true; stick(it.stub, r.p, r.p.clone().add(r.d.clone().setLength(stubLen))); } else it.stub.visible = false;
      }
      for (let i = 0; i < n; i++) {
        const it = items[i], nx = items[i + 1], ok = nx && it.v && nx.v; it.con.visible = !!ok;
        if (ok) stick(it.con, it.p, nx.p);
      }
    },
  };
}

// ════════ 원자 · 분자 ════════
const ELEM = {
  H: { c: '#f8fafc', r: .26, ko: '수소', p: 1 }, He: { c: '#67e8f9', r: .28, ko: '헬륨', p: 2 },
  C: { c: '#3f3f46', r: .36, ko: '탄소', p: 6 }, N: { c: '#3b82f6', r: .35, ko: '질소', p: 7 },
  O: { c: '#ef4444', r: .34, ko: '산소', p: 8 }, Na: { c: '#a78bfa', r: .42, ko: '나트륨', p: 11 },
  Al: { c: '#cbd5e1', r: .4, ko: '알루미늄', p: 13 }, Si: { c: '#d4a373', r: .4, ko: '규소', p: 14 },
  Cl: { c: '#22c55e', r: .4, ko: '염소', p: 17 }, Ca: { c: '#a3e635', r: .44, ko: '칼슘', p: 20 },
  Fe: { c: '#c2410c', r: .42, ko: '철', p: 26 }, Au: { c: '#facc15', r: .44, ko: '금', p: 79 },
};
// atomBall('O', 크기배율, 얼굴?) → 원소 색 공 (분자 모형용)
function atomBall(el, s = 1, face = false) {
  const e = ELEM[el] || ELEM.C;
  if (face) { const g = critter(e.r * s, e.c, { squash: 1 }); g.userData.el = el; return g; }
  const m = ball(e.r * s, e.c); m.userData.el = el; return m;
}
// atomModel({p:양성자, n:중성자, e:전자}) : 가운데 원자핵 + 도는 전자. 매 프레임 atom.update(t)
//  cloud:true 면 전자 대신 흐릿한 구름. shell: 전자 궤도 반지름
function atomModel({ p = 1, n = 0, e = 1, s = 1, shell = 1.4, cloud = false, eColor = '#38bdf8', rings = true } = {}) {
  const g = new THREE.Group(), nuc = new THREE.Group(), N = p + n, rr = .16 * s;
  const pm = mat('#ef4444'), nm = mat('#94a3b8'), sg = new THREE.SphereGeometry(rr, 16, 12);
  const kr = rr * Math.cbrt(N) * .95;
  for (let i = 0; i < N; i++) {
    const m = new THREE.Mesh(sg, i % 2 === 0 && i / 2 < p ? pm : (i >= 2 * Math.min(p, n) && i < N && p > n ? pm : nm));
    const v = N === 1 ? V() : new THREE.Vector3().randomDirection().multiplyScalar(kr * Math.cbrt(Math.random()));
    m.position.copy(v); nuc.add(m);
  }
  // 양성자 수가 정확하도록 색 다시 칠하기
  nuc.children.forEach((m, i) => m.material = i < p ? pm : nm);
  g.add(nuc);
  const elec = [], orbits = [];
  const shells = []; let left = e; const cap = [2, 8, 8, 18]; for (const c of cap) { if (left <= 0) break; shells.push(Math.min(c, left)); left -= c; }
  shells.forEach((cnt, si) => {
    const R = shell * s * (1 + si * .75);
    const tilt = new THREE.Euler(.5 + si * .7, si * 1.1, .3 * si);
    if (rings && !cloud) { const ring = new THREE.Mesh(new THREE.TorusGeometry(R, .012 * s, 6, 80), new THREE.MeshBasicMaterial({ color: '#93c5fd', transparent: true, opacity: .55 })); ring.rotation.copy(tilt); ring.rotation.x += Math.PI / 2; g.add(ring); orbits.push(ring); }
    for (let k = 0; k < cnt; k++) { const el = ball(.09 * s, emat(eColor, .8)); g.add(el); elec.push({ el, R, ph: k / cnt * Math.PI * 2, sp: 2.2 / (1 + si * .6), tilt }); }
  });
  let cl = null;
  if (cloud) { cl = dotCloud(700, () => V(gauss(), gauss(), gauss()).multiplyScalar(shell * s * .55), eColor, .05 * s, .55); g.add(cl); elec.forEach(o => o.el.visible = false); }
  const api = {
    group: g, nucleus: nuc, electrons: elec, orbits, cloud: cl,
    update(t) {
      nuc.rotation.y = t * .3; nuc.position.set(.01 * Math.sin(t * 40), .01 * Math.cos(t * 37), 0);
      for (const o of elec) { const a = o.ph + t * o.sp; o.el.position.set(o.R * Math.cos(a), 0, o.R * Math.sin(a)).applyEuler(o.tilt); }
      if (cl) cl.rotation.y = t * .2;
    },
  };
  api.update(0); return api;
}
// molecule([[원소, x,y,z], ...], [[i,j], ...], 크기) → 그룹 (공-막대 모형)
function molecule(atoms, bonds = [], s = 1, face = false) {
  const g = new THREE.Group(), list = atoms.map(([el, x, y, z]) => { const a = atomBall(el, s, face); a.position.set(x * s, y * s, z * s); g.add(a); return a; });
  for (const [i, j] of bonds) g.add(bond(list[i].position, list[j].position, .06 * s));
  g.userData.atoms = list; return g;
}
// 물 분자 H₂O (산소 가운데)
const water = (s = 1, face = false) => molecule([['O', 0, 0, 0], ['H', -.55, -.42, 0], ['H', .55, -.42, 0]], [[0, 1], [0, 2]], s, face);

// ════════ 구슬 기차 (생물물리 2권 공통 그림말) ════════
// nucCar('A') : DNA 글자 한 칸 = 기차 한 칸. +x 쪽이 진행 방향(5′→3′).
//  보라 오각형 몸통(당), 왼쪽 파란 공 = 머리(5′, 인산), 오른쪽 주황 고리 = 꼬리(3′, 새 칸이 붙는 곳), 아래로 색 막대 = 글자(염기).
//  car.rotation.z = Math.PI 로 뒤집으면 반대 방향 줄(역평행, 글자가 위를 봐요). 칸 사이 간격 CAR_GAP.
const CAR_GAP = .56;
const _carGeo = {};
function nucCar(base = 'A', { s = 1, letter = false, body = '#c4b5fd' } = {}) {
  const k = 'g' + s;
  const G = _carGeo[k] || (_carGeo[k] = {
    body: new THREE.CylinderGeometry(.2 * s, .2 * s, .16 * s, 5), head: new THREE.SphereGeometry(.085 * s, 14, 10),
    hook: new THREE.TorusGeometry(.065 * s, .025 * s, 8, 16), stick: new THREE.CylinderGeometry(.075 * s, .075 * s, .44 * s, 12), cap: new THREE.SphereGeometry(.09 * s, 12, 8),
  });
  const g = new THREE.Group();
  const b = new THREE.Mesh(G.body, mat(body)); b.rotation.x = Math.PI / 2; b.rotation.y = Math.PI / 10;
  const h = new THREE.Mesh(G.head, mat('#38bdf8')); h.position.set(-.27 * s, 0, 0);
  const t = new THREE.Mesh(G.hook, mat('#fb923c')); t.position.set(.27 * s, 0, 0); t.rotation.y = Math.PI / 2;
  const c = BASE[base] || '#999', st = new THREE.Mesh(G.stick, mat(c)); st.position.set(0, -.36 * s, 0);
  const cp = new THREE.Mesh(G.cap, mat(c)); cp.position.set(0, -.58 * s, 0);
  g.add(b, h, t, st, cp);
  if (letter) { const l = label(base, .3 * s, '#fff'); l.position.set(0, -.36 * s, .12 * s); g.add(l); g.userData.letter = l; }
  Object.assign(g.userData, { base, head: h, hook: t, stick: st, cap: cp, bodyMesh: b });
  return g;
}
// trainStrand('ATGC', {x0, y, flip}) → { group, cars, n }. flip=true 면 반대 방향(오른쪽이 5′) 줄
function trainStrand(seq, { x0 = null, y = 0, z = 0, flip = false, letter = false, s = 1 } = {}) {
  const g = new THREE.Group(), n = seq.length, start = x0 ?? -(n - 1) * CAR_GAP * s / 2;
  const cars = [...seq].map((ch, i) => { const c = nucCar(ch, { s, letter }); c.position.set(start + i * CAR_GAP * s, y, z); if (flip) c.rotation.z = Math.PI; g.add(c); return c; });
  return { group: g, cars, n, x: i => start + i * CAR_GAP * s };
}

// ════════ 7세판 공통: 동물 친구 · 장난감 블록 · 바닥 ════════
// animal('bear'|'rabbit'|'pig'|'dog'|'cat'|'sheep', 색, 크기) → 발바닥 y=0, 앞(+z)을 봐요. 키 약 1.2*s
//  userData: head, armL, armR(어깨에서 돌리면 손 흔들기: armR.rotation.z = -1.2 등), body
function animal(kind = 'bear', c = '#c68642', s = 1, { belly = '#fff3e0', ear2 = null } = {}) {
  const g = new THREE.Group(), body = new THREE.Group(); g.add(body);
  const bd = ball(.32 * s, c, 0, .4 * s, 0); bd.scale.set(1, 1.1, .9); body.add(bd);
  const bl = ball(.2 * s, belly, 0, .38 * s, .17 * s); bl.scale.set(1, 1.15, .5); body.add(bl);
  for (const k of [-1, 1]) { const f = ball(.11 * s, c, k * .14 * s, .07 * s, .06 * s); f.scale.set(1, .6, 1.3); body.add(f); }
  const arms = [-1, 1].map(k => { const a = new THREE.Group(); a.position.set(k * .28 * s, .55 * s, .02 * s); const h = ball(.09 * s, c, k * .08 * s, -.12 * s, 0); h.scale.set(.9, 1.4, .9); a.add(h); body.add(a); return a; });
  const head = new THREE.Group(); head.position.set(0, .95 * s, 0); body.add(head);
  const fc = kind === 'sheep' ? '#f5e1c8' : c; head.add(ball(.28 * s, fc));
  for (const k of [-1, 1]) {
    head.add(ball(.037 * s, '#1f2937', k * .095 * s, .05 * s, .245 * s), ball(.013 * s, '#ffffff', k * .095 * s + .012 * s, .065 * s, .275 * s));

function toyCar(base = 'A', { s = 1, face = false } = {}) {

  naming() { try { return mode === 'name'; } catch (e) { return false; } },
  sun(r) {

    o.traverse(m => {

    gr.add(dotCloud(n, i => {

const Q2B = {
  flash(c = '#fde047', r = .2) { const f = ball(r, emat(c, 1)); f.material.transparent = true; f.visible = false; return f; },
  pop(f, t, t0, pos, dur = .45, grow = 2.5) {
    const a = t - t0; f.visible = a >= 0 && a < dur;

  hop(t, t0, dur, x0, y0, x1, y1, h = .4) {
    const u = (t - t0) / dur; if (u < 0 || u > 1) return null;

const Q2C = {
  naming() { try { return mode === 'name'; } catch (e) { return false; } },
  grey: new THREE.Color('#9ca3af'), rust: new THREE.Color('#b4410c'),
  flash(c = '#fde047') { return new THREE.Mesh(new THREE.SphereGeometry(.3, 16, 10), new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: 0, depthWrite: false })); },
  setFlash(m, k) { m.visible = k > 0 && k < 1; m.scale.setScalar(.4 + 1.6 * k); m.material.opacity = .8 * (1 - k); },
  rnd(seed) { let s = seed; return () => (s = (s * 9301 + 49297) % 233280) / 233280; },
  // 쇠 원자 + 날아와 손잡는 산소 원자 한 쌍. update(t, 도착시각)
  pair(parent, x, y, s = 1) {
    const m = mat('#9ca3af'), fe = critter(.42 * s, m); fe.position.set(x, y, 0);
    const o = critter(.3 * s, '#ef4444'), b = rod(.06 * s, '#fbbf24');

    };
  },
};

let qstep = 0, order = [0, 1, 2];
function startQuiz() {
  setMode('quiz'); qstep = solved.has(cur) ? 0 : 0; $('#feedback').hidden = true; startPhase(0); renderQ(); readQ();
}
const readQ = () => { const L = LESSONS[cur], [q, ch] = qstep === 0 ? [L.q, L.choices] : [L.q2, L.choices2]; say(`${q} ${order.map((k, i) => `${i + 1}번, ${ch[k][1]}`).join(' ')}`); };
function renderQ() {
  const L = LESSONS[cur], [q, ch] = qstep === 0 ? [L.q, L.choices] : [L.q2, L.choices2];
  order = [0, 1, 2].sort(() => Math.random() - .5);
  $('#st1').className = qstep === 0 ? 'on' : 'done'; $('#st2').className = qstep === 1 ? 'on' : '';
  $('#q').textContent = q; $('#tip').textContent = '';
  $('#choices').replaceChildren(...order.map(k => {
    const [e, t] = ch[k], b = document.createElement('button'), em = document.createElement('span');
    em.className = 'emo'; em.textContent = e; em.setAttribute('aria-hidden', 'true'); b.append(em, t); b.onclick = () => pick(k, b); return b;
  }));
}
function pick(k, b) {
  const L = LESSONS[cur], ans = qstep === 0 ? L.answer : L.answer2, hint = qstep === 0 ? L.hint : L.hint2;
  if (k !== ans) { b.classList.add('wrong'); b.disabled = true; $('#tip').textContent = `🤔 다시 생각해 볼까요? ${hint}`; say(`다시 생각해 볼까요? ${hint}`); return; }
  [...$('#choices').children].forEach(x => x.disabled = true); b.classList.add('right');
  if (qstep === 0) { qstep = 1; $('#tip').textContent = '👍 맞아요! 그럼 왜 그럴까요?'; say('맞아요! 그럼 왜 그럴까요?'); setTimeout(() => { renderQ(); readQ(); }, 700); return; }
  $('#st2').className = 'done'; $('#tip').textContent = '';
  $('#kid').textContent = `"${L.kid}"`; $('#feedback').hidden = false;
  solved.add(cur); refreshDots(); say(`딩동댕! 둘 다 맞았어요. ${L.kid}`);
  if (solved.size === LESSONS.length) toast(`🏆 ${LESSONS.length}개를 모두 풀었어요! ${BOOK.champion} 탄생!`);
}
$('#rewatchBtn').onclick = () => { wstep = 0; setMode('watch'); renderWatch(); };

// ③ 이름표
$('#nameBtn').onclick = () => {
  // 큰 이름은 언제나 진짜 과학 이름. name.kid 가 있으면 아래에 작게 '쉬운 말' (7세판)
  const L = LESSONS[cur], term = L.name.term, jo = L.name.josa || irago(term), formal = L.name.kid || '';
  setMode('name'); startPhase(0);
  $('#ntext').replaceChildren('이걸 ', Object.assign(document.createElement('span'), { className: 'term', textContent: term }), ` ${jo} 해요!`.replace(' ' + jo, jo), ...(formal ? [Object.assign(document.createElement('span'), { className: 'formal', textContent: '쉬운 말로는 · ' + formal })] : []));
  $('#nsub').replaceChildren(L.name.what, ...(L.habit ? [Object.assign(document.createElement('span'), { className: 'habit', textContent: '🏠 생활 습관 · ' + L.habit })] : []));
  $('#adult').textContent = L.adult;
  nameSprite = label(term, .34, '#fde047'); nameSprite.position.set(0, .95, -3.2);
  const maxW = 2.2 * camera.aspect; if (nameSprite.userData.base[0] > maxW) { const r = maxW / nameSprite.userData.base[0]; nameSprite.userData.base = nameSprite.userData.base.map(v => v * r); }
  camera.add(nameSprite);
  $('#nnextBtn').textContent = cur === LESSONS.length - 1 ? '처음으로 ▶' : '다음 이야기 ▶';
  $('#nextBtn').classList.add('go');
  say(`이걸 ${term}${jo} 해요! ${formal ? '쉬운 말로는 ' + formal + '. ' : ''}${L.name.what} ${L.habit ? '생활 습관. ' + L.habit : ''}`);
};
$('#againBtn').onclick = () => { wstep = 0; setMode('watch'); renderWatch(); };
$('#nnextBtn').onclick = () => show((cur + 1) % LESSONS.length);

function toast(msg) { const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toast.id); toast.id = setTimeout(() => el.hidden = true, 3200); }
$('#prevBtn').onclick = () => cur > 0 && show(cur - 1);
$('#nextBtn').onclick = () => show((cur + 1) % LESSONS.length);
$('#homeBtn').onclick = () => { autoCam = false; endLoop(); home(.6); };
$('#voiceBtn').onclick = e => {
  voice = !voice; e.currentTarget.setAttribute('aria-pressed', voice);
  if (voice) { if (mode === 'watch') say(LESSONS[cur].watch[wstep][0]); else if (mode === 'quiz') readQ(); else say(`이걸 ${LESSONS[cur].name.term}${LESSONS[cur].name.josa || irago(LESSONS[cur].name.term)} 해요! ${LESSONS[cur].name.what}`); }
  else window.speechSynthesis?.cancel();
};

// 글꼴(Jua)을 먼저 받아야 3D 글자가 예쁘게 나와요 (글자 조각별로 내려받는 구글 폰트 대응)
const allText = JSON.stringify(LESSONS) + Object.values(SCENES).map(f => f.toString()).join('') + '0123456789';
Promise.race([document.fonts?.load?.("78px Jua", allText) || Promise.resolve(), new Promise(r => setTimeout(r, 2500))]).catch(() => {}).then(() => show(0));

</script>
