<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>양자물리 놀이터 · 넷째 권</title>
<meta property="og:title" content="양자물리 놀이터 · 넷째 권">
<meta property="og:description" content="진짜 양자 세상: 빛 알갱이, 알갱이이면서 물결, 중첩, 측정, 불확정성, 스핀, 얽힘, 레이저, LED, 양자 컴퓨터를 동화와 3D 영상으로">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--ink:#23324a;--sub:#5b6b82;--bg:#eef4ff;--card:#fff;--accent:#2563eb;--accent2:#93c5fd;--ok:#22a861;--okbg:#e8f8ef;--no:#e5484d;--nobg:#fdecec;--line:#dbe3ee;--lv:#1d4ed8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Jua',system-ui,'Malgun Gothic',sans-serif}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px}
h1{margin:0;font-size:24px;font-weight:400}
.lv{background:var(--lv);color:#fff;padding:4px 12px;border-radius:999px;font-size:15px}
.booklink{font-size:15px;color:var(--accent);text-decoration:none;background:#fff;border-radius:999px;padding:4px 12px;box-shadow:0 2px 0 #0001}
#stars{margin-left:auto;font-size:20px}
#dots{display:flex;gap:6px;flex-wrap:wrap;width:100%}
#dots button{width:38px;height:38px;border-radius:50%;border:3px solid var(--line);background:#fff;font:inherit;font-size:16px;color:var(--ink);cursor:pointer}
#dots button.on{border-color:var(--accent);background:var(--accent);color:#fff}
main{display:grid;gap:16px;padding:0 16px 16px}
@media(min-width:900px){
  main{grid-template-columns:1.35fr 1fr;height:calc(100vh - 120px);min-height:580px}
  #stage{min-height:0!important}
}
#stage{position:relative;min-height:55vh;border-radius:28px;overflow:hidden;background:#dde9ff}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.tools{position:absolute;top:10px;right:10px;display:flex;gap:6px}
.tools button,.tbtn{font:inherit;font-size:16px;padding:8px 14px;border-radius:999px;border:0;background:#fffe;color:var(--ink);box-shadow:0 2px 0 #0002;cursor:pointer}
.tbtn[aria-pressed=true]{background:var(--accent);color:#fff}
/* 돋보기(확대) 칩 */
#spots{position:absolute;top:10px;left:10px;right:110px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
#spots button{pointer-events:auto;font:inherit;font-size:16px;padding:7px 12px;border-radius:999px;border:3px solid #fff;background:#fff8d6;color:#7a4a00;box-shadow:0 2px 0 #0002;cursor:pointer}
#spots button.on{background:#f59e0b;color:#fff;border-color:#fde68a}
#spots button.all{background:#fff;color:var(--ink)}
/* 영상 조작 막대 */
#player{position:absolute;left:10px;right:10px;bottom:10px;display:flex;align-items:center;gap:6px;background:#ffffffe8;border-radius:999px;padding:5px 8px;box-shadow:0 3px 10px #0002}
#player button{font:inherit;font-size:16px;min-width:44px;height:40px;padding:0 10px;border-radius:999px;border:0;background:#f1f5f9;color:var(--ink);cursor:pointer;white-space:nowrap}
#player button.main{background:var(--accent);color:#fff;min-width:52px}
#player button[aria-pressed=true]{background:#fde68a}
#seek{flex:1;min-width:40px;accent-color:var(--accent);height:28px}
#ptime{font-size:14px;color:var(--sub);min-width:34px;text-align:right}
.hint{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);background:#fffd;padding:6px 14px;border-radius:999px;font-size:15px;pointer-events:none;transition:opacity .6s;white-space:nowrap}
.card{background:var(--card);border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 0 #0000000f;overflow:auto}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{background:#ede9fe;color:#5b21b6;padding:5px 14px;border-radius:999px;font-size:16px}
h2{margin:0;font-size:30px;font-weight:400}
.story{margin:0;font-size:20px;line-height:1.5;color:var(--sub)}
.steps{display:flex;gap:8px;font-size:15px;flex-wrap:wrap}
.steps span{padding:3px 12px;border-radius:999px;background:#f1f5f9;color:#94a3b8}
.steps span.on{background:var(--accent);color:#fff}
.steps span.done{background:var(--okbg);color:var(--ok)}
.q{margin:0;font-size:25px;line-height:1.4}
#choices{display:grid;gap:10px}
#choices button{display:flex;align-items:center;gap:12px;min-height:64px;padding:12px 16px;border-radius:20px;border:3px solid var(--line);background:#fff;font:inherit;font-size:23px;color:var(--ink);text-align:left;cursor:pointer;transition:transform .1s}
#choices button:hover:not(:disabled){border-color:var(--accent);transform:translateY(-2px)}
#choices button .emo{font-size:30px;width:40px;text-align:center}
#choices button.right{border-color:var(--ok);background:var(--okbg)}
#choices button.wrong{border-color:var(--no);background:var(--nobg);opacity:.65;animation:shake .4s}
#choices button:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
#tip{margin:0;font-size:20px;color:#b4500a;min-height:1em}
#feedback{background:var(--okbg);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
#feedback[hidden]{display:none}
#feedback .yay{font-size:26px;color:var(--ok)}
#feedback .big{font-size:24px;line-height:1.45}
.pbtn{font:inherit;font-size:22px;padding:12px 20px;border-radius:18px;border:0;background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 4px 0 #0003}
.sbtn{font:inherit;font-size:20px;padding:11px 16px;border-radius:18px;border:3px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.sbtn:disabled{opacity:.4;cursor:default}
.mode{display:none;flex-direction:column;gap:12px}
.mode.on{display:flex}
.ldots{display:flex;gap:8px;align-items:center}
.ldots span{width:14px;height:14px;border-radius:50%;background:var(--line)}
.ldots span.on{background:var(--accent)}
.ldots span.done{background:var(--ok)}
.ldots span.q{border-radius:4px;width:22px}
.ldots em{font-style:normal;font-size:15px;color:var(--sub);margin-left:6px}
#wtext{margin:0;font-size:31px;line-height:1.4;min-height:2.8em}
.look{margin:0;font-size:18px;color:#7a4a00;background:#fff8d6;border-radius:14px;padding:8px 14px}
#ntext{margin:0;font-size:34px;line-height:1.4}
#ntext .term{display:inline-block;background:#fef3c7;color:#92400e;border:3px solid #f59e0b;border-radius:16px;padding:2px 16px;font-size:40px}
#ntext .formal{display:block;margin-top:6px;font-size:18px;color:var(--sub)}
#nsub{margin:0;font-size:21px;color:var(--sub);line-height:1.5}
#nsub .habit{display:block;margin-top:10px;background:#ecfdf5;color:#065f46;border:2px solid #a7f3d0;border-radius:14px;padding:8px 14px;font-size:20px}
#adult{margin:0;font-size:14px;color:var(--sub);font-family:system-ui,'Malgun Gothic',sans-serif;line-height:1.55;display:flex;flex-direction:column;gap:6px}
#adult .ad-h{color:var(--ink);font-weight:600}
#adult ul{margin:2px 0 0;padding-left:18px}
#adult li{margin:2px 0}
#adult .ad-life{background:#f1f5f9;border-radius:10px;padding:6px 10px}
#adult details{border-top:1px dashed var(--line);padding-top:4px}
#adult summary{cursor:pointer;color:var(--accent);font-weight:600}
#adult .ad-map,#adult .ad-more{margin-top:4px}
nav{display:flex;justify-content:space-between;gap:10px;margin-top:auto}
nav button{font:inherit;font-size:21px;padding:12px 22px;border-radius:18px;border:3px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
nav button.go{border-color:var(--accent);background:var(--accent);color:#fff}
button:focus-visible{outline:4px solid #2b7fff;outline-offset:2px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-size:17px;z-index:20}
#toast[hidden]{display:none}

@media(max-width:899px){
  header{padding:8px 12px;gap:8px}
  h1{font-size:20px}
  .lv{font-size:13px}
  #stars{font-size:17px}
  #dots{gap:4px}
  #dots button{width:30px;height:30px;font-size:13px;border-width:2px}
  main{padding:0 10px 12px;gap:10px}
  #stage{position:sticky;top:0;z-index:5;height:46vh;height:46svh;min-height:280px;border-radius:20px;box-shadow:0 6px 12px #23324a22}
  .tools{top:6px;right:6px}
  .tools button{font-size:13px;padding:6px 10px}
  #spots{top:6px;left:6px;right:84px;gap:4px}
  #spots button{font-size:13px;padding:4px 9px;border-width:2px}
  #player{left:6px;right:6px;bottom:6px;gap:4px;padding:4px 6px}
  #player button{font-size:13px;min-width:36px;height:34px;padding:0 7px}
  #player button.main{min-width:42px}
  #ptime{display:none}
  .hint{font-size:12px;padding:5px 10px;bottom:48px}
  .card{padding:16px;border-radius:20px;gap:10px}
  h2{font-size:23px}
  .story{font-size:17px}
  .q{font-size:21px}
  #choices button{min-height:52px;font-size:19px;padding:10px 12px;border-radius:16px}
  #choices button .emo{font-size:24px;width:32px}
  #tip{font-size:17px}
  #feedback .yay{font-size:22px}
  #feedback .big{font-size:20px}
  .pbtn{font-size:19px;padding:10px 16px}
  .sbtn{font-size:17px;padding:9px 12px}
  #wtext{font-size:23px;min-height:2.6em}
  .look{font-size:15px}
  #ntext{font-size:25px}
  #ntext .term{font-size:29px;padding:2px 12px}
  #nsub{font-size:18px}
  nav button{font-size:18px;padding:10px 16px}
}
</style>
</head>
<body>
<header>
  <h1>⚛️ 양자물리 놀이터</h1>
  <span class="lv">넷째 권 · 진짜 양자 세상</span>
  <a class="booklink" href="./">📚 책 고르기</a>
  <span id="stars" aria-live="polite">⭐ 0</span>
  <div id="dots" role="tablist" aria-label="이야기"></div>
</header>
<main>
  <section id="stage" aria-label="움직이는 3D 화면">
    <div id="spots" aria-label="돋보기"></div>
    <div class="tools"><button id="homeBtn">🎯 제자리</button></div>
    <div class="hint" id="hint">🔍 돋보기를 누르면 크게 · 끌면 돌아가요</div>
    <div id="player" aria-label="영상 조작">
      <button id="playBtn" class="main" aria-label="멈춤">⏸</button>
      <button id="restartBtn" aria-label="처음부터">⏮</button>
      <button id="speedBtn" aria-label="빠르기">🐇 보통</button>
      <input id="seek" type="range" min="0" max="1000" value="0" aria-label="장면 위치">
      <span id="ptime">0초</span>
    </div>
  </section>
  <section class="card">
    <div class="row">
      <span class="badge" id="badge"></span>
      <button class="tbtn" id="voiceBtn" aria-pressed="false">🔊 읽어 주기</button>
    </div>
    <h2 id="title"></h2>
    <!-- ① 보기 -->
    <div id="watch" class="mode">
      <div class="ldots" id="wdots"></div>
      <p class="story" id="story"></p>
      <p id="wtext"></p>
      <p class="look" id="look"></p>
      <div class="row"><button class="sbtn" id="wprevBtn">◀ 앞 장면</button><button class="pbtn" id="wnextBtn">다음 장면 ▶</button></div>
    </div>
    <!-- ② 문제 -->
    <div id="quiz" class="mode">
      <div class="steps"><span id="st1">① 무엇을 봤나요?</span><span id="st2">② 왜 그럴까?</span></div>
      <p class="q" id="q"></p>
      <div id="choices"></div>
      <p id="tip" aria-live="polite"></p>
      <div id="feedback" hidden aria-live="polite">
        <div class="yay">🎉 딩동댕! 둘 다 맞았어요</div>
        <p class="big" id="kid"></p>
        <div><button class="pbtn" id="nameBtn">🏷️ 이름 알아보기</button></div>
      </div>
      <div class="row"><button class="sbtn" id="rewatchBtn">🎬 영상 다시 보기</button></div>
    </div>
    <!-- ③ 이름표 -->
    <div id="name" class="mode">
      <p id="ntext"></p>
      <p id="nsub"></p>
      <div id="adult"></div>
      <div class="row"><button class="sbtn" id="againBtn">🎬 처음부터 다시 보기</button><button class="pbtn" id="nnextBtn">다음 이야기 ▶</button></div>
    </div>
    <nav>
      <button id="prevBtn">◀ 이전</button>
      <button id="nextBtn">다음 ▶</button>
    </nav>
  </section>
</main>
<div id="toast" hidden></div>
<script>

class TouchOrbit {
  constructor(cam, el) {

    el.addEventListener('pointerdown', e => { el.setPointerCapture?.(e.pointerId); this.pts.set(e.pointerId, [e.clientX, e.clientY]); this.onUser?.(); });
    el.addEventListener('pointermove', e => {
      if (!this.pts.has(e.pointerId)) return;
      const [px, py] = this.pts.get(e.pointerId);
      if (this.pts.size === 1) {
        this.sph.theta -= (e.clientX - px) * .008;
        this.sph.phi = Math.min(Math.PI - .15, Math.max(.15, this.sph.phi - (e.clientY - py) * .008));

  }

// ── 기본 도우미 ──
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const ease = t => (t = clamp(t, 0, 1), t * t * (3 - 2 * t));
const lerp = (a, b, t) => a + (b - a) * t;
const pulse = t => 1 + .12 * Math.sin(t * 6);
const seg = (t, a, b) => ease((t - a) / (b - a));           // a~b초 사이 0→1
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const mat = c => new THREE.MeshStandardMaterial({ color: c, roughness: .5 });
const emat = (c, k = .6) => new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: k, roughness: .4 });

function mesh(geo, c, x = 0, y = 0, z = 0) {

}
const box = (w, h, d, c, x, y, z) => mesh(new THREE.BoxGeometry(w, h, d), c, x, y, z);
const ball = (r, c, x, y, z) => mesh(new THREE.SphereGeometry(r, 24, 14), c, x, y, z);
const cyl = (rt, rb, h, c, x, y, z) => mesh(new THREE.CylinderGeometry(rt, rb, h, 20), c, x, y, z);
const hideAll = (...o) => o.forEach(x => x && (x.visible = false));
const showAll = (...o) => o.forEach(x => x && (x.visible = true));

// 글자 스프라이트: 글자 길이에 맞춰 폭이 늘어나요. size = 글자 높이(월드 단위)
function label(text, size = .45, color = '#fff', stroke = '#23324acc') {
  size *= (globalThis.LABEL_K || 1); // 폰처럼 좁은 화면이면 글자를 키워요
  const cv = document.createElement('canvas'), x = cv.getContext('2d'), F = "78px Jua, 'Malgun Gothic', sans-serif";
  x.font = F; const w = Math.ceil(x.measureText(text).width) + 40;
  cv.width = Math.max(128, w); cv.height = 128;
  x.font = F; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.lineWidth = 14; x.lineJoin = 'round'; x.strokeStyle = stroke; x.strokeText(text, cv.width / 2, 68);
  x.fillStyle = color; x.fillText(text, cv.width / 2, 68);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
  s.userData.base = [size * cv.width / 128, size]; s.scale.set(...s.userData.base, 1); s.renderOrder = 10; return s;
}
const setOpacity = (o, k) => o.traverse(m => { if (m.material) { m.material.transparent = true; m.material.opacity = k; } });
function line(pts, color, dashed = false) {
  const geo = new THREE.BufferGeometry().setFromPoints(pts.map(p => p.isVector3 ? p : new THREE.Vector3(...p)));
  const m = dashed ? new THREE.LineDashedMaterial({ color, dashSize: .15, gapSize: .1 }) : new THREE.LineBasicMaterial({ color });

}
// 화살표: 원점이 꼬리, 기본은 아래(-y). rotation.z = π/2 → 오른쪽, -π/2 → 왼쪽, π → 위
function arrow(len, color, w = .07) {
  const g = new THREE.Group();
  const shaft = cyl(w, w, len - .25, color, 0, -(len - .25) / 2, 0), tip = mesh(new THREE.ConeGeometry(w * 2.6, .25, 16), color, 0, -(len - .125), 0);
  tip.rotation.z = Math.PI; g.add(shaft, tip); return g;
}
// 원기둥 막대를 두 점 사이에 놓기 (막대는 높이 1짜리로 만들어 두기)
const _up = new THREE.Vector3(0, 1, 0), _d = new THREE.Vector3();

  m.position.addVectors(p, q).multiplyScalar(.5); m.scale.set(1, Math.max(L, 1e-4), 1);

const rod = (r, c) => mesh(new THREE.CylinderGeometry(r, r, 1, 12), c);
function bond(p, q, r = .07, c = '#cbd5e1') { const m = rod(r, c); stick(m, p, q); return m; }

function starField(n = 400, R = 30, c = '#ffffff') {
  const pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { const v = new THREE.Vector3().randomDirection().multiplyScalar(R * (.6 + .4 * Math.random())); pos.set([v.x, v.y, v.z], i * 3); }
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  return new THREE.Points(geo, new THREE.PointsMaterial({ color: c, size: .12 }));
}
// 점구름 (전자 구름, 물방울 안개 등). spread(i) → Vector3
function dotCloud(n, spread, c = '#60a5fa', size = .06, o = .8) {
  const pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { const v = spread(i); pos.set([v.x, v.y, v.z], i * 3); }
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  return new THREE.Points(geo, new THREE.PointsMaterial({ color: c, size, transparent: true, opacity: o, depthWrite: false }));
}
// 정규분포 난수 (전자 구름 퍼짐)
const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };

// ── 눈 달린 친구(효소·단백질·원자 캐릭터) ──
// critter(반지름, 색) → 그룹. 앞(+z)을 봐요. g.userData.body 를 흔들면 살아 있는 느낌.
function critter(r, c, { eyes = true, smile = true, squash = .85, eyeY = .22 } = {}) {
  const g = new THREE.Group(), body = new THREE.Group();
  const b = ball(r, c); b.scale.set(1, squash, 1); body.add(b);
  if (eyes) for (const s of [-1, 1]) {
    const ez = Math.sqrt(Math.max(.05, 1 - eyeY * eyeY)) * squash, w = ball(r * .22, '#ffffff', s * r * .33, r * eyeY * squash, r * ez * .92), p = ball(r * .11, '#1f2937', s * r * .33, r * eyeY * squash, r * (ez * .92 + .18));
    body.add(w, p);
  }
  if (smile) { const my = eyeY > .4 ? eyeY - .25 : -.05, mz = Math.sqrt(Math.max(.05, 1 - my * my)) * squash; const m = mesh(new THREE.TorusGeometry(r * .18, r * .04, 8, 16, Math.PI), '#1f2937', 0, r * my * squash, r * mz * .95); m.rotation.z = Math.PI; body.add(m); }
  g.add(body); g.userData.body = body; return g;
}
const wobble = (g, t, k = 1) => { const b = g.userData.body || g; b.scale.set(1 + .05 * k * Math.sin(t * 7), 1 - .05 * k * Math.sin(t * 7), 1); };

// ════════ 생물: DNA · RNA ════════
// 염기 색: A 빨강, T 노랑, G 초록, C 파랑, U(RNA) 주황
const BASE = { A: '#ef4444', T: '#facc15', G: '#22c55e', C: '#3b82f6', U: '#fb923c' };
const PAIR = { A: 'T', T: 'A', G: 'C', C: 'G' };
const RPAIR = { A: 'U', T: 'A', G: 'C', C: 'G' };   // DNA 글자 → RNA 짝
const randSeq = (n, seed = 1) => { let s = seed; return Array.from({ length: n }, () => 'ATGC'[(s = (s * 9301 + 49297) % 233280) % 4]).join(''); };

// dnaModel(seq) : x축으로 누운 이중나선. 매 프레임 dna.update(돌림각, i => 벌어짐 0~1)
//  - bp[i].off (Vector3) 로 조각을 옮길 수 있고 (offA/offB 는 위/아래 가닥만), hideA/hideB 로 한 가닥만 숨기기, bp[i].cut = true 면 i와 i+1 사이 뼈대가 끊겨요.
//  - dna.posA(i)/posB(i): 현재 두 뼈대 구슬 위치, dna.x(i): i번째 칸의 x
function dnaModel(seq, o = {}) {
  const { rise = .34, R = .55, perTurn = 10, c1 = '#a78bfa', c2 = '#38bdf8', br = .1, gap = .9, x0 = null } = o;
  const g = new THREE.Group(), n = seq.length, bp = [];
  const sg = new THREE.SphereGeometry(br, 14, 10), rg = new THREE.CylinderGeometry(.065, .065, 1, 10), cg = new THREE.CylinderGeometry(.045, .045, 1, 8);
  const m1 = mat(c1), m2 = mat(c2), mb = {}; for (const k in BASE) mb[k] = mat(BASE[k]);
  const start = x0 ?? -(n - 1) * rise / 2;
  for (let i = 0; i < n; i++) {
    const s = seq[i], p = PAIR[s] || 'A';
    const a = new THREE.Mesh(sg, m1), b = new THREE.Mesh(sg, m2), ra = new THREE.Mesh(rg, mb[s]), rb = new THREE.Mesh(rg, mb[p]);
    const ca = new THREE.Mesh(cg, m1), cb = new THREE.Mesh(cg, m2);
    g.add(a, b, ra, rb, ca, cb); bp.push({ a, b, ra, rb, ca, cb, base: s, pair: p, off: new THREE.Vector3(), offA: new THREE.Vector3(), offB: new THREE.Vector3(), cut: false, hide: false });
  }
  const PA = [], PB = []; for (let i = 0; i < n; i++) { PA.push(V()); PB.push(V()); }
  const api = {
    group: g, bp, n, seq, rise, R,
    x: i => start + i * rise,
    posA: i => g.localToWorld(PA[i].clone()), posB: i => g.localToWorld(PB[i].clone()),
    localA: i => PA[i], localB: i => PB[i],
    update(spin = 0, openFn = null) {
      for (let i = 0; i < n; i++) {
        const B = bp[i], o = ease(openFn ? openFn(i) : 0), th = i * 2 * Math.PI / perTurn + spin, x = start + i * rise;
        PA[i].set(x, lerp(R * Math.cos(th), gap, o), lerp(R * Math.sin(th), 0, o)).add(B.off).add(B.offA);
        PB[i].set(x, lerp(-R * Math.cos(th), -gap, o), lerp(-R * Math.sin(th), 0, o)).add(B.off).add(B.offB);
        const mid = V(x, 0, 0).add(B.off), L = .42;
        const ea = mid.clone().lerp(PA[i].clone().add(V(0, -L, 0)), o), eb = mid.clone().add(B.offB).lerp(PB[i].clone().add(V(0, L, 0)), o);
        if (o < .01) eb.copy(ea);
        B.a.position.copy(PA[i]); B.b.position.copy(PB[i]);
        stick(B.ra, PA[i], ea); stick(B.rb, PB[i], eb);
        for (const m of [B.a, B.b, B.ra, B.rb]) m.visible = !B.hide;
        B.rb.visible = B.b.visible = !B.hide && !B.hideB;
        B.ra.visible = B.a.visible = !B.hide && !B.hideA;
      }
      for (let i = 0; i < n; i++) {
        const B = bp[i], ok = i < n - 1 && !B.cut && !B.hide && !bp[i + 1].hide;
        B.ca.visible = ok && !B.hideA && !bp[i + 1]?.hideA; B.cb.visible = ok && !B.hideB && !bp[i + 1]?.hideB && !B.cutB;
        if (ok) { stick(B.ca, PA[i], PA[i + 1]); stick(B.cb, PB[i], PB[i + 1]); }
      }
    },
  };
  api.update(0);
  return api;
}

// beadChain(글자들) : 구슬 사슬 (RNA, 아미노산 줄, 고분자 등). 매 프레임 chain.place(i => ({p, d, v}))
//  p: 구슬 위치, d: 염기 막대 방향(없으면 막대 숨김), v: 보임 여부
function beadChain(seq, o = {}) {
  const { color = '#fb923c', br = .1, stubLen = .42, colors = BASE, link = .045 } = o;
  const g = new THREE.Group(), n = seq.length, items = [];
  const sg = new THREE.SphereGeometry(br, 14, 10), rg = new THREE.CylinderGeometry(.065, .065, 1, 10), cg = new THREE.CylinderGeometry(link, link, 1, 8);
  const mbk = mat(color);
  for (let i = 0; i < n; i++) {
    const c = typeof colors === 'string' ? colors : (colors[seq[i]] || color);
    const bead = new THREE.Mesh(sg, o.beadColors ? mat(c) : mbk), stub = new THREE.Mesh(rg, mat(c)), con = new THREE.Mesh(cg, mbk);
    g.add(bead, stub, con); items.push({ bead, stub, con, base: seq[i], p: V(), v: false });
  }
  return {
    group: g, items, n,
    place(fn) {
      for (let i = 0; i < n; i++) {
        const it = items[i], r = fn(i) || { v: false };
        it.v = r.v !== false && !!r.p; it.bead.visible = it.v;
        if (!it.v) { it.stub.visible = false; continue; }
        it.p.copy(r.p); it.bead.position.copy(r.p);
        if (r.d) { it.stub.visible = true; stick(it.stub, r.p, r.p.clone().add(r.d.clone().setLength(stubLen))); } else it.stub.visible = false;
      }
      for (let i = 0; i < n; i++) {
        const it = items[i], nx = items[i + 1], ok = nx && it.v && nx.v; it.con.visible = !!ok;
        if (ok) stick(it.con, it.p, nx.p);
      }
    },
  };
}

// ════════ 원자 · 분자 ════════
const ELEM = {
  H: { c: '#f8fafc', r: .26, ko: '수소', p: 1 }, He: { c: '#67e8f9', r: .28, ko: '헬륨', p: 2 },
  C: { c: '#3f3f46', r: .36, ko: '탄소', p: 6 }, N: { c: '#3b82f6', r: .35, ko: '질소', p: 7 },
  O: { c: '#ef4444', r: .34, ko: '산소', p: 8 }, Na: { c: '#a78bfa', r: .42, ko: '나트륨', p: 11 },
  Al: { c: '#cbd5e1', r: .4, ko: '알루미늄', p: 13 }, Si: { c: '#d4a373', r: .4, ko: '규소', p: 14 },
  Cl: { c: '#22c55e', r: .4, ko: '염소', p: 17 }, Ca: { c: '#a3e635', r: .44, ko: '칼슘', p: 20 },
  Fe: { c: '#c2410c', r: .42, ko: '철', p: 26 }, Au: { c: '#facc15', r: .44, ko: '금', p: 79 },
};
// atomBall('O', 크기배율, 얼굴?) → 원소 색 공 (분자 모형용)
function atomBall(el, s = 1, face = false) {
  const e = ELEM[el] || ELEM.C;
  if (face) { const g = critter(e.r * s, e.c, { squash: 1 }); g.userData.el = el; return g; }
  const m = ball(e.r * s, e.c); m.userData.el = el; return m;
}
// atomModel({p:양성자, n:중성자, e:전자}) : 가운데 원자핵 + 도는 전자. 매 프레임 atom.update(t)
//  cloud:true 면 전자 대신 흐릿한 구름. shell: 전자 궤도 반지름
function atomModel({ p = 1, n = 0, e = 1, s = 1, shell = 1.4, cloud = false, eColor = '#38bdf8', rings = true } = {}) {
  const g = new THREE.Group(), nuc = new THREE.Group(), N = p + n, rr = .16 * s;
  const pm = mat('#ef4444'), nm = mat('#94a3b8'), sg = new THREE.SphereGeometry(rr, 16, 12);
  const kr = rr * Math.cbrt(N) * .95;
  for (let i = 0; i < N; i++) {
    const m = new THREE.Mesh(sg, i % 2 === 0 && i / 2 < p ? pm : (i >= 2 * Math.min(p, n) && i < N && p > n ? pm : nm));
    const v = N === 1 ? V() : new THREE.Vector3().randomDirection().multiplyScalar(kr * Math.cbrt(Math.random()));
    m.position.copy(v); nuc.add(m);
  }
  // 양성자 수가 정확하도록 색 다시 칠하기
  nuc.children.forEach((m, i) => m.material = i < p ? pm : nm);
  g.add(nuc);
  const elec = [], orbits = [];
  const shells = []; let left = e; const cap = [2, 8, 8, 18]; for (const c of cap) { if (left <= 0) break; shells.push(Math.min(c, left)); left -= c; }
  shells.forEach((cnt, si) => {
    const R = shell * s * (1 + si * .75);
    const tilt = new THREE.Euler(.5 + si * .7, si * 1.1, .3 * si);
    if (rings && !cloud) { const ring = new THREE.Mesh(new THREE.TorusGeometry(R, .012 * s, 6, 80), new THREE.MeshBasicMaterial({ color: '#93c5fd', transparent: true, opacity: .55 })); ring.rotation.copy(tilt); ring.rotation.x += Math.PI / 2; g.add(ring); orbits.push(ring); }
    for (let k = 0; k < cnt; k++) { const el = ball(.09 * s, emat(eColor, .8)); g.add(el); elec.push({ el, R, ph: k / cnt * Math.PI * 2, sp: 2.2 / (1 + si * .6), tilt }); }
  });
  let cl = null;
  if (cloud) { cl = dotCloud(700, () => V(gauss(), gauss(), gauss()).multiplyScalar(shell * s * .55), eColor, .05 * s, .55); g.add(cl); elec.forEach(o => o.el.visible = false); }
  const api = {
    group: g, nucleus: nuc, electrons: elec, orbits, cloud: cl,
    update(t) {
      nuc.rotation.y = t * .3; nuc.position.set(.01 * Math.sin(t * 40), .01 * Math.cos(t * 37), 0);
      for (const o of elec) { const a = o.ph + t * o.sp; o.el.position.set(o.R * Math.cos(a), 0, o.R * Math.sin(a)).applyEuler(o.tilt); }
      if (cl) cl.rotation.y = t * .2;
    },
  };
  api.update(0); return api;
}
// molecule([[원소, x,y,z], ...], [[i,j], ...], 크기) → 그룹 (공-막대 모형)
function molecule(atoms, bonds = [], s = 1, face = false) {
  const g = new THREE.Group(), list = atoms.map(([el, x, y, z]) => { const a = atomBall(el, s, face); a.position.set(x * s, y * s, z * s); g.add(a); return a; });
  for (const [i, j] of bonds) g.add(bond(list[i].position, list[j].position, .06 * s));
  g.userData.atoms = list; return g;
}
// 물 분자 H₂O (산소 가운데)
const water = (s = 1, face = false) => molecule([['O', 0, 0, 0], ['H', -.55, -.42, 0], ['H', .55, -.42, 0]], [[0, 1], [0, 2]], s, face);

// ════════ 구슬 기차 (생물물리 2권 공통 그림말) ════════
// nucCar('A') : DNA 글자 한 칸 = 기차 한 칸. +x 쪽이 진행 방향(5′→3′).
//  보라 오각형 몸통(당), 왼쪽 파란 공 = 머리(5′, 인산), 오른쪽 주황 고리 = 꼬리(3′, 새 칸이 붙는 곳), 아래로 색 막대 = 글자(염기).
//  car.rotation.z = Math.PI 로 뒤집으면 반대 방향 줄(역평행, 글자가 위를 봐요). 칸 사이 간격 CAR_GAP.
const CAR_GAP = .56;
const _carGeo = {};
function nucCar(base = 'A', { s = 1, letter = false, body = '#c4b5fd' } = {}) {
  const k = 'g' + s;
  const G = _carGeo[k] || (_carGeo[k] = {
    body: new THREE.CylinderGeometry(.2 * s, .2 * s, .16 * s, 5), head: new THREE.SphereGeometry(.085 * s, 14, 10),
    hook: new THREE.TorusGeometry(.065 * s, .025 * s, 8, 16), stick: new THREE.CylinderGeometry(.075 * s, .075 * s, .44 * s, 12), cap: new THREE.SphereGeometry(.09 * s, 12, 8),
  });
  const g = new THREE.Group();
  const b = new THREE.Mesh(G.body, mat(body)); b.rotation.x = Math.PI / 2; b.rotation.y = Math.PI / 10;
  const h = new THREE.Mesh(G.head, mat('#38bdf8')); h.position.set(-.27 * s, 0, 0);
  const t = new THREE.Mesh(G.hook, mat('#fb923c')); t.position.set(.27 * s, 0, 0); t.rotation.y = Math.PI / 2;
  const c = BASE[base] || '#999', st = new THREE.Mesh(G.stick, mat(c)); st.position.set(0, -.36 * s, 0);
  const cp = new THREE.Mesh(G.cap, mat(c)); cp.position.set(0, -.58 * s, 0);
  g.add(b, h, t, st, cp);
  if (letter) { const l = label(base, .3 * s, '#fff'); l.position.set(0, -.36 * s, .12 * s); g.add(l); g.userData.letter = l; }
  Object.assign(g.userData, { base, head: h, hook: t, stick: st, cap: cp, bodyMesh: b });
  return g;
}
// trainStrand('ATGC', {x0, y, flip}) → { group, cars, n }. flip=true 면 반대 방향(오른쪽이 5′) 줄
function trainStrand(seq, { x0 = null, y = 0, z = 0, flip = false, letter = false, s = 1 } = {}) {
  const g = new THREE.Group(), n = seq.length, start = x0 ?? -(n - 1) * CAR_GAP * s / 2;
  const cars = [...seq].map((ch, i) => { const c = nucCar(ch, { s, letter }); c.position.set(start + i * CAR_GAP * s, y, z); if (flip) c.rotation.z = Math.PI; g.add(c); return c; });
  return { group: g, cars, n, x: i => start + i * CAR_GAP * s };
}

// ════════ 7세판 공통: 동물 친구 · 장난감 블록 · 바닥 ════════
// animal('bear'|'rabbit'|'pig'|'dog'|'cat'|'sheep', 색, 크기) → 발바닥 y=0, 앞(+z)을 봐요. 키 약 1.2*s
//  userData: head, armL, armR(어깨에서 돌리면 손 흔들기: armR.rotation.z = -1.2 등), body
function animal(kind = 'bear', c = '#c68642', s = 1, { belly = '#fff3e0', ear2 = null } = {}) {
  const g = new THREE.Group(), body = new THREE.Group(); g.add(body);
  const bd = ball(.32 * s, c, 0, .4 * s, 0); bd.scale.set(1, 1.1, .9); body.add(bd);
  const bl = ball(.2 * s, belly, 0, .38 * s, .17 * s); bl.scale.set(1, 1.15, .5); body.add(bl);
  for (const k of [-1, 1]) { const f = ball(.11 * s, c, k * .14 * s, .07 * s, .06 * s); f.scale.set(1, .6, 1.3); body.add(f); }
  const arms = [-1, 1].map(k => { const a = new THREE.Group(); a.position.set(k * .28 * s, .55 * s, .02 * s); const h = ball(.09 * s, c, k * .08 * s, -.12 * s, 0); h.scale.set(.9, 1.4, .9); a.add(h); body.add(a); return a; });
  const head = new THREE.Group(); head.position.set(0, .95 * s, 0); body.add(head);
  const fc = kind === 'sheep' ? '#f5e1c8' : c; head.add(ball(.28 * s, fc));
  for (const k of [-1, 1]) {
    head.add(ball(.037 * s, '#1f2937', k * .095 * s, .05 * s, .245 * s), ball(.013 * s, '#ffffff', k * .095 * s + .012 * s, .065 * s, .275 * s));
    const ck = ball(.045 * s, '#fda4af', k * .17 * s, -.04 * s, .2 * s); ck.scale.set(1, .6, .4); head.add(ck);
    const ec = ear2 || c;
    if (kind === 'bear') head.add(ball(.09 * s, ec, k * .19 * s, .2 * s, -.02 * s));
    if (kind === 'rabbit') { const e = ball(.07 * s, ec, k * .1 * s, .42 * s, -.02 * s); e.scale.set(1, 3, .7); e.rotation.z = -k * .12; head.add(e); const ei = ball(.04 * s, '#fbcfe8', k * .1 * s, .42 * s, .03 * s); ei.scale.set(1, 3, .5); ei.rotation.z = -k * .12; head.add(ei); }
    if (kind === 'pig' || kind === 'cat') { const e = mesh(new THREE.ConeGeometry(.08 * s, .17 * s, 12), ec, k * .16 * s, .26 * s, 0); e.rotation.z = -k * .35; head.add(e); }
    if (kind === 'dog') { const e = ball(.09 * s, ec, k * .26 * s, .02 * s, -.02 * s); e.scale.set(.55, 1.5, .8); e.rotation.z = k * .25; head.add(e); }
    if (kind === 'sheep') { for (let q = 0; q < 4; q++) head.add(ball(.1 * s, '#ffffff', k * (.08 + .07 * q) * s, (.24 - .05 * q) * s, -.04 * s)); }
  }
  if (kind === 'pig') { const sn = cyl(.08 * s, .08 * s, .06 * s, '#f9a8d4', 0, -.05 * s, .27 * s); sn.rotation.x = Math.PI / 2; head.add(sn); }
  else if (kind === 'sheep') { head.add(ball(.03 * s, '#7c4a2d', 0, -.04 * s, .275 * s)); for (let q = 0; q < 7; q++) bd.add(ball(.14, '#ffffff', Math.cos(q) * .26, .05 + .2 * Math.sin(q * 2), Math.sin(q) * .2)); }
  else { const mz = ball(.1 * s, kind === 'bear' || kind === 'dog' ? '#f5deb3' : fc, 0, -.06 * s, .2 * s); mz.scale.set(1.1, .8, .8); head.add(mz, ball(.035 * s, '#3b2a1a', 0, -.03 * s, .29 * s)); }
  const sm = mesh(new THREE.TorusGeometry(.045 * s, .011 * s, 6, 12, Math.PI), '#3b2a1a', 0, -.1 * s, .275 * s); sm.rotation.z = Math.PI; head.add(sm);
  g.userData = { head, armL: arms[0], armR: arms[1], body, kind };
  return g;
}
// 걷는 흔들림: t초, 세기
const waddle = (a, t, k = 1) => { a.userData.body.rotation.z = .08 * k * Math.sin(t * 9); a.userData.body.position.y = .03 * k * Math.abs(Math.sin(t * 9)); };
// 바닥 (생활 장면용): floor(가로, 세로, 색)
const floor = (w = 10, d = 5, c = '#fde7c4') => box(w, .1, d, c, 0, -.05, 0);

  ],
  q: '보리 동전이 금색이면, 멀리 간 두리 동전은?',
  choices: [['⚪', '꼭 회색이에요!'], ['🟡', '똑같이 금색이에요!'], ['🌀', '아무 색도 아니에요!']], answer: 0,
  hint: '보리가 동전을 멈춘 순간 두리 동전을 봤지요? 짝꿍 동전은 늘 반대였어요.',

  hint2: '한쪽 전자가 ↑ 주황이면 멀리 있는 짝은 ↓ 보라였지요? 아무리 멀어도 반대예요.',
  kid: '하나를 보면 짝꿍은 반대로!',
  name: { term: '양자 얽힘', kid: '멀리 있어도 짝꿍', what: '짝꿍으로 묶인 양자 알갱이는 아무리 멀리 떨어져도, 하나를 보는 순간 다른 하나가 반대로 정해져요. 그래도 이걸로 편지를 빨리 보낼 수는 없어요.' },
  habit: '멀리 사는 할머니, 할아버지께 가끔 안부 전화를 드려요.',

    cond: ['측정 전에는 각 입자의 결과가 미리 정해져 있지 않다. 장갑 한 짝을 보면 다른 짝을 아는 것(미리 정해진 경우)과 다르다는 것을 벨 부등식 실험이 보여 주었다.', '한쪽 결과는 무작위라서, 얽힘만으로는 정보(편지)를 빛보다 빨리 보낼 수 없다. 결과를 비교하려면 보통의 통신이 필요하다.', '주변과 부딪히면(결어긋남) 얽힘이 쉽게 깨져서, 실험은 아주 조심스럽게 해야 한다.'],
    life: '양자 암호 통신은 얽힘·양자 상태를 이용해 누가 엿들으면 바로 드러나게 한다. 2017년 중국 위성 묵자호가 1,200 km 넘게 떨어진 곳 사이에서 얽힘을 나누는 실험에 성공했다.',
    map: '마법 짝꿍 동전 = 얽힌 전자 짝, 금색 동전 면 = 위 ↑(주황), 회색 동전 면 = 아래 ↓(보라), 동전을 멈추기 = 측정',

SCENES.q4_entangle = (g, ctx) => {
  const GOLD = '#fbbf24', GREY = '#9ca3af', UP = '#f97316', DN = '#8b5cf6', ELEC = '#38bdf8', SPACE = '#0b1026';
  const BG0 = new THREE.Color(BOOK.sceneBg), BG1 = new THREE.Color(SPACE), bgc = new THREE.Color();
  const nm = () => typeof mode !== 'undefined' && mode === 'name';
  const allLabels = [];
  const lab = (txt, sz, col) => { const l = label(txt, sz, col); g.add(l); allLabels.push(l); l.visible = false; return l; };

  // ── 생활 장면: 바닥, 기찻길, 보리·두리, 기차 ──
  const life = new THREE.Group(); g.add(life);
  life.add(floor(10, 4.2, '#fde7c4'));
  const track = box(6.4, .04, .5, '#a16207', 1.2, .02, .9); life.add(track);
  for (let i = 0; i < 12; i++) life.add(box(.08, .05, .7, '#78350f', -1.8 + i * .55, .03, .9));
  const bori = animal('bear', '#c68642', .9); bori.position.set(-2.5, 0, .2); bori.rotation.y = .35; life.add(bori);
  const train = new THREE.Group(); life.add(train);
  train.add(box(1.2, .55, .7, '#ef4444', 0, .45, 0), box(.5, .35, .72, '#fde68a', -.25, .78, 0), box(.35, .3, .3, '#334155', .45, .85, 0));
  for (const x of [-.4, .4]) for (const z of [-.37, .37]) { const w = cyl(.14, .14, .08, '#1f2937', x, .17, z); w.rotation.x = Math.PI / 2; train.add(w); }
  const duri = animal('rabbit', '#f5f5f4', .75); duri.position.set(-.1, .72, 0); train.add(duri);
  const puffs = Array.from({ length: 4 }, () => { const p = ball(.12, '#ffffff'); train.add(p); return p; });

  // ── 동전 (앞 금색, 뒤 회색) ──
  const mkCoin = () => {
    const c = new THREE.Group();
    const a = cyl(.3, .3, .03, GOLD); a.rotation.x = Math.PI / 2; a.position.z = .017;
    const b = cyl(.3, .3, .03, GREY); b.rotation.x = Math.PI / 2; b.position.z = -.017;
    const rim = mesh(new THREE.TorusGeometry(.3, .02, 6, 32), '#d6d3d1');
    c.add(a, b, rim); g.add(c); return c;
  };
  const coinA = mkCoin(), coinB = mkCoin();
  // 금색 면이 보이면 rotation.y = 0, 회색 면이 보이면 π
  const setCoin = (c, spin, t, face, k) => { c.rotation.y = spin * t * 14 + (face === 'G' ? 0 : Math.PI); c.visible = true; c.scale.setScalar(k); };

  // ── 양자 그림: 하늘색 전자 + 화살표 ──
  const mkElec = () => {
    const e = new THREE.Group();
    const body = critter(.32, ELEC, { squash: 1 }); e.add(body);
    const ar = new THREE.Group(); const au = arrow(1.1, UP, .08); au.rotation.z = Math.PI; au.position.y = -.55; ar.add(au); ar.position.x = .55; e.add(ar);
    const ad = new THREE.Group(); const dd = arrow(1.1, DN, .08); dd.position.y = .55; ad.add(dd); ad.position.x = .55; e.add(ad);
    const halo = mesh(new THREE.TorusGeometry(.48, .03, 6, 40), '#fde047'); e.add(halo);
    e.userData = { body, ar, ad, halo }; g.add(e); return e;
  };
  const eA = mkElec(), eB = mkElec();
  // spin=1 이면 ↑↓가 번갈아 번쩍(정해지지 않음), spin=0 이면 dir 쪽 하나만
  const setElec = (e, spin, t, dir, k, flash) => {
    const u = e.userData, w = Math.sin(t * 11) > 0;
    if (spin > .5) { u.ar.visible = w; u.ad.visible = !w; } else { u.ar.visible = dir === 'U'; u.ad.visible = dir === 'D'; }
    u.ar.rotation.z = u.ad.rotation.z = spin * .4 * Math.sin(t * 9);
    u.halo.visible = flash > 0; u.halo.scale.setScalar(1 + .6 * flash);
    e.scale.setScalar(k); wobble(u.body, t, spin);
  };

  // 별 (우주 장면)
  const stars = starField(260, 22); g.add(stars);
  // 연결 점선 (짝꿍)
  const link = line([[-2.6, 1.6, 0], [2.6, 1.6, 0]], '#fde047', true); g.add(link);
  const setLink = (a, b) => { const p = link.geometry.attributes.position.array; p.set([a.x, a.y, a.z, b.x, b.y, b.z]); link.geometry.attributes.position.needsUpdate = true; link.computeLineDistances(); };
  // 편지 + ✕
  const letter = new THREE.Group(); g.add(letter);
  letter.add(box(.6, .4, .04, '#ffffff'), line([[-.3, .2, .03], [0, -.02, .03], [.3, .2, .03]], '#94a3b8'));
  const xMark = lab('✕', .6, '#ef4444');

  const lSpin = lab('빙글빙글! 금색? 회색?', .42, '#fde047'), lGold = lab('● 금색!', .44, GOLD), lGrey = lab('● 회색!', .44, '#e5e7eb');
  const lOpp = lab('늘 반대!', .5, '#fde047'), lMorphA = lab('● 금색 = ↑ 주황', .38, UP), lMorphB = lab('● 회색 = ↓ 보라', .38, DN);
  const lFar = lab('아주 멀리 떨어져도', .4, '#fde047'), lMail = lab('편지는 빨리 못 보내요', .4, '#fecaca');
  const tally = Array.from({ length: 4 }, (_, i) => { const a = ball(.13, GOLD), b = ball(.13, GREY); g.add(a, b); return { a, b }; });
  const ROUND = ['G', 'R', 'R', 'G']; // 보리 결과 (두리는 늘 반대)

  const coinPos = { A: V(-1.9, 1.35, .5) };
  const TX = 2.0, trainX = t => lerp(-.4, TX, seg(t, .6, 4.2));

  const bgSet = k => { bgc.copy(BG0).lerp(BG1, k); ctx.bg(bgc); stars.visible = k > .05; stars.material.opacity = k; stars.material.transparent = true; };
  const reset = () => {
    allLabels.forEach(l => l.visible = false); tally.forEach(o => { o.a.visible = o.b.visible = false; });
    life.visible = true; setOpacity(life, 1); bgSet(0); link.visible = false; letter.visible = false;
    eA.visible = eB.visible = false; coinA.visible = coinB.visible = true; setOpacity(coinA, 1); setOpacity(coinB, 1);
    train.position.set(-.4, 0, .9); duri.userData.armR.rotation.z = 0; bori.userData.armR.rotation.z = 0;
    puffs.forEach(p => p.visible = false);
  };
  const trainPuff = (t, moving) => puffs.forEach((p, i) => { const k = (t * 1.4 + i / 4) % 1; p.visible = moving; p.position.set(.45 - k * .6, 1.05 + k * .8, 0); p.scale.setScalar(.5 + k); });

  // 장면 1: 나란히 같이 빙글
  const s1 = t => {
    train.position.set(-.4, 0, .9);
    coinA.position.copy(coinPos.A); coinB.position.set(-.4, 1.95, 1.2);
    setCoin(coinA, 1, t, 'G', 1); setCoin(coinB, 1, t + .7, 'R', 1);
    bori.userData.armR.rotation.z = -1 - .2 * Math.sin(t * 4); duri.userData.armR.rotation.z = -1 - .2 * Math.sin(t * 4 + 1);
    lSpin.visible = t > 1.2; lSpin.position.set(-1.3, 2.75, .5);
  };
  // 장면 2: 기차로 멀리 → 멈추면 금색 / 그 순간 회색
  const STOP2 = 7;
  const s2 = t => {
    const tx = trainX(t); train.position.set(tx, 0, .9); trainPuff(t, t > .6 && t < 4.2);
    waddle(duri, t, t > .6 && t < 4.2 ? .4 : 0);
    coinA.position.copy(coinPos.A); coinB.position.set(tx, 1.95, 1.2);
    const sp = t < STOP2 ? 1 : 1 - seg(t, STOP2, STOP2 + .5);
    setCoin(coinA, sp, t, 'G', t > STOP2 ? 1.25 : 1); setCoin(coinB, sp, t + .7, 'R', t > STOP2 ? 1.25 : 1);
    bori.userData.armR.rotation.z = t > STOP2 - .4 && t < STOP2 + .4 ? -1.6 : -1;
    if (t > STOP2 + .3) { lGold.visible = true; lGold.position.set(-1.9, 2.2, .5); lGrey.visible = true; lGrey.position.set(tx, 2.8, 1.2); }
  };
  // 장면 3: 여러 번 — 늘 반대
  const s3 = t => {
    const tx = TX; train.position.set(tx, 0, .9);
    const r = Math.min(3, Math.floor(t / 3)), tt = t - r * 3;
    coinA.position.copy(coinPos.A); coinB.position.set(tx, 1.95, 1.2);
    const sp = tt < 1.4 ? 1 : 1 - seg(tt, 1.4, 1.8), res = ROUND[r];
    setCoin(coinA, sp, t, res, 1.15); setCoin(coinB, sp, t + .7, res === 'G' ? 'R' : 'G', 1.15);
    for (let i = 0; i < 4; i++) {
      const done = i < r || (i === r && tt > 1.8); const o = tally[i];
      o.a.visible = o.b.visible = done;
      o.a.material.color.set(ROUND[i] === 'G' ? GOLD : GREY); o.b.material.color.set(ROUND[i] === 'G' ? GREY : GOLD);
      o.a.position.set(-2.6 + i * .34, 3.05, 0); o.b.position.set(1.4 + i * .34, 3.05, 0);
    }
    lOpp.visible = t > 4; lOpp.position.set(0, 3.0, 0);
  };
  // 장면 4 (= ph0): 바뀌는 장면 → 측정
  const s4 = t => {
    const tx = TX; train.position.set(tx, 0, .9);
    const m = seg(t, 1.6, 4.4);
    setOpacity(life, 1 - m); life.visible = m < .99; bgSet(.85 * m);
    coinA.position.copy(coinPos.A); coinB.position.set(tx, 1.95, 1.2);
    const sp = t < 8 ? 1 : 1 - seg(t, 8, 8.5), dirA = 'U';
    setCoin(coinA, 1, t, 'G', 1 - .6 * m); setCoin(coinB, 1, t + .7, 'R', 1 - .6 * m);
    setOpacity(coinA, 1 - m); setOpacity(coinB, 1 - m); coinA.visible = coinB.visible = m < .99;
    eA.visible = eB.visible = m > .01; eA.position.copy(coinA.position); eB.position.copy(coinB.position);
    setOpacity(eA, m); setOpacity(eB, m);
    setElec(eA, sp, t, dirA, .4 + .6 * m, t > 8 && t < 9.2 ? seg(t, 8, 9.2) : 0); setElec(eB, sp, t + .5, 'D', .4 + .6 * m, t > 8 && t < 9.2 ? seg(t, 8, 9.2) : 0);
    link.visible = m > .6; setLink(eA.position, eB.position);
    if (t > 4.4 && t < 7.8) { lMorphA.visible = true; lMorphA.position.set(-1.7, 2.6, .5); lMorphB.visible = true; lMorphB.position.set(tx - .6, 3.05, 1.2); }
    if (t > 8.5) { lOpp.visible = true; lOpp.position.set(.3, 2.9, .8); }
  };
  // 장면 5: 아주 멀리, 두 번 측정, 편지 ✕
  const s5 = t => {
    life.visible = false; bgSet(1); coinA.visible = coinB.visible = false;
    eA.visible = eB.visible = true; setOpacity(eA, 1); setOpacity(eB, 1);
    eA.position.set(-2.3, 1.3, 0); eB.position.set(1.9, 1.3, 0);
    link.visible = true; setLink(eA.position, eB.position);
    const run = t < 5.5 ? 0 : 1, tt = t - run * 5.5;
    const sp = tt < 2 ? 1 : 1 - seg(tt, 2, 2.4), fl = tt > 2 && tt < 3.2 ? seg(tt, 2, 3.2) : 0;
    const dA = run === 0 ? 'U' : 'D';
    setElec(eA, sp, t, dA, 1.2, fl); setElec(eB, sp, t + .5, dA === 'U' ? 'D' : 'U', 1.2, fl);
    lFar.visible = t < 2; lFar.position.set(0, 2.5, 0);
    if (tt > 2.4) { lOpp.visible = true; lOpp.position.set(0, 2.6, 0); }
    letter.visible = t > 9.6; letter.position.set(-1.2 + .8 * seg(t, 9.6, 10.6), .3, .3);
    xMark.visible = t > 10.6; xMark.position.set(-.4, .35, .5);
    lMail.visible = t > 10.6; lMail.position.set(0, -.35, .5); if (lMail.visible) lOpp.visible = false;
  };

  const draw = (t, ph) => {
    reset();
    if (ph === 1) s1(t); else if (ph === 2) s2(t); else if (ph === 3) s3(t); else if (ph === 5) s5(t); else s4(Math.min(t, 12));
    if (nm()) allLabels.forEach(l => l.visible = false);
  };
  draw.spots = {
    1: [['🔍 빙글 짝꿍 동전', coinA, 2.4, '두 동전이 같이 빙글 돌아요. 아직 금색도 회색도 아니에요', null, { loop: [1, 4], slow: .5 }]],
    2: [['🔍 멈추는 순간', coinA, 2.4, '보리 동전이 멈추니 금색이에요', null, { loop: [6.2, 8.6], slow: .5 }],
        ['🔍 두리 동전', coinB, 2.4, '그 순간 멀리 있는 두리 동전은 회색이에요', null, { loop: [6.2, 8.6], slow: .5 }]],
    3: [['🔍 늘 반대', [0, 2.2, .5], 5.4, '보리가 금색이면 두리는 회색, 보리가 회색이면 두리는 금색이에요', null, { loop: [3, 7], slow: .5 }]],
    4: [['🔍 바뀌는 동전', coinA, 2.6, '금색 동전이 같은 자리에서 ↑ 주황 화살표 전자로 바뀌어요', null, { loop: [1.4, 5], slow: .5 }],
        ['🔍 짝꿍 전자', eB, 2.6, '보리 전자가 ↑ 주황이면 짝꿍 전자는 ↓ 보라예요', null, { loop: [7.6, 10], slow: .5 }]],
    5: [['🔍 멀리 있는 짝꿍', [0, 1.3, 0], 6.6, '아주 멀리 떨어져도 하나를 보면 짝은 반대로 정해져요', null, { loop: [1.6, 4], slow: .5 }],
        ['🔍 편지', letter, 2.6, '하지만 이걸로 편지를 빨리 보낼 수는 없어요', null, { loop: [9.4, 12], slow: .5 }]],
  };
  draw.spots[0] = draw.spots[4];
  draw.cam = { 2: [[6.4, 0], [7.8, 1], [10.4, -1]], 3: [[3.6, 0], [9.6, -1]], 4: [[1.6, 0], [5, -1], [7.8, 1], [10.6, -1]], 5: [[1.8, 0], [4.4, -1], [9.4, 1]], 0: [[1.6, 0], [5, -1], [7.8, 1], [10.6, -1]] };
  return draw;

SCENES.q4_led = (g, ctx) => {
  const naming = () => { try { return mode === 'name'; } catch (e) { return false; } };
  const fade = (o, k) => { o.visible = k > .01; if (o.visible) setOpacity(o, Math.min(1, k)); };
  const BLUE = '#60a5fa', LILAC = '#c4b5fd', CY = '#38bdf8', Y = '#fde047', RED = '#ef4444', BL = '#3b82f6';
  const C_DAY = new THREE.Color(BOOK.sceneBg), C_IN = new THREE.Color('#1e293b'), C_TMP = new THREE.Color();

  // ── 작은 전구 속 두 층 만들기 ──
  const makeLED = (cx, w, yUp, yLo, n, pc) => {
    const grp = new THREE.Group(); g.add(grp);
    const up = box(w, .3, 1.4, BLUE, cx, yUp, 0), lo = box(w, .3, 1.4, LILAC, cx, yLo, 0);
    grp.add(up, lo);
    const xs = Array.from({ length: n }, (_, i) => cx + (i - (n - 1) / 2) * (w / n));
    const holes = xs.map(x => { const h = cyl(.18, .18, .04, '#312e81', x, yLo + .17, 0); grp.add(h); return h; });
    const els = xs.map(x => { const e = critter(.2, CY); e.position.set(x, yUp + .35, 0); grp.add(e); return e; });
    const phs = xs.map(() => { const p = ball(.14, emat(pc, 1)); p.visible = false; grp.add(p); return p; });
    const run = (t, t0, per) => {
      let last = -1;
      xs.forEach((x, i) => {
        const td = t0 + i * per, e = els[i], f = clamp((t - td) / .55, 0, 1);
        e.position.set(x, lerp(yUp + .35, yLo + .35, f * f), 0);
        wobble(e, t + i, f > 0 && f < 1 ? 2 : .4);
        holes[i].visible = f < .98;
        const ph = phs[i], a = clamp((t - td - .55) / 1.5, 0, 1);
        ph.visible = a > 0 && a < 1;
        if (ph.visible) { ph.position.set(x + .4 * a, yLo + .4 + 1.7 * a, .3 + 1.6 * a); ph.scale.setScalar(1 + .7 * Math.sin(a * Math.PI)); last = i; }
      });
      return last;
    };
    return { grp, up, lo, xs, holes, els, phs, run };
  };

  // ── 놀이터 (장면 1) ──
  const play = new THREE.Group(); g.add(play);
  play.add(floor(11, 5, '#fde7c4'));
  const slide = box(3.58, .08, 1.0, '#fb923c', -.2, 1.68, 0); slide.rotation.z = Math.atan2(-1.6, 3.2); play.add(slide);
  for (const z of [-.45, .45]) play.add(cyl(.05, .05, 2.4, '#94a3b8', -3.45, 1.2, z));
  for (let k = 0; k < 5; k++) play.add(cyl(.035, .035, .9, '#94a3b8', -3.45, .35 + k * .45, 0).rotateX(Math.PI / 2));
  for (const [x, h] of [[-3.3, 2.4], [-1.9, 2.4], [1.5, .8], [2.9, .8]]) for (const z of [-.6, .6]) play.add(cyl(.06, .06, h, '#94a3b8', x, h / 2, z));

  // 큰 LED (높은 칸·낮은 칸이 그대로 위층·아래층이 돼요)
  const L = makeLED(0, 5.6, 2.4, .8, 4, Y);
  const shell = new THREE.Group(); g.add(shell);
  const dome = mesh(new THREE.SphereGeometry(1, 32, 16), tmat('#e0f2fe', .22), 0, 1.6, 0); dome.scale.set(3.55, 1.9, 1.3); shell.add(dome);
  for (const x of [-.9, .9]) shell.add(cyl(.07, .07, 1.3, '#94a3b8', x, -.1, 0));
  const fadeShell = k => { shell.visible = k > .01; if (shell.visible) { setOpacity(shell, k); dome.material.opacity = .22 * k; } };

  const bori = animal('bear', '#c68642', .75); g.add(bori);
  const lHi = label('● 높은 칸', .4, '#93c5fd'), lLo = label('● 낮은 칸', .4, '#c4b5fd'), lPop = label('뿅!', .5, '#fde047'), lKong = label('콩!', .5, '#fde047'), lShoong = label('슝!', .5, '#fde047');
  const lUp2 = label('● 위층 = 전자 길', .38, '#93c5fd'), lLo2 = label('● 아래층 = 빈자리', .38, '#c4b5fd');
  g.add(lHi, lLo, lPop, lUp2, lLo2, lKong, lShoong);

  // ── 빨강·파랑 비교 (장면 4) ──
  const LR = makeLED(-2.0, 2.6, 1.3, .8, 2, RED), LB = makeLED(2.0, 2.6, 2.6, .8, 2, BL);
  const aR = arrow(.5, RED, .05); aR.position.set(-2.0, 1.15, .75); LR.grp.add(aR);
  const aB = arrow(1.8, BL, .05); aB.position.set(2.0, 2.45, .75); LB.grp.add(aB);
  const lR = label('낮으면 빨강', .4, '#fca5a5'), lB = label('높으면 파랑', .4, '#93c5fd');
  lR.position.set(-2.0, 2.2, 0); lB.position.set(2.0, 3.5, 0); LR.grp.add(lR); LB.grp.add(lB);

  // ── 신호등과 전광판 (장면 5) ──
  const street = new THREE.Group(); g.add(street);
  street.add(floor(11, 5, '#cbd5e1'));
  for (let k = 0; k < 5; k++) street.add(box(.35, .02, 1.6, '#ffffff', -.6 + k * .6, .01, 1));
  street.add(cyl(.08, .08, 2.6, '#475569', 2.6, 1.3, -.3), box(.8, 2.1, .45, '#1f2937', 2.6, 3.3, -.3));
  const lampCols = ['#ef4444', '#f59e0b', '#22c55e'];
  const lamps = lampCols.map((c, i) => { const m = cyl(.27, .27, .08, c, 2.6, 4.0 - i * .68, -.05); m.rotation.x = Math.PI / 2; m.material = new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: 0 }); street.add(m); return m; });
  const board = new THREE.Group(); board.position.set(-1.9, 2.9, -.4); street.add(board);
  board.add(box(2.6, 1.5, .15, '#111827', 0, 0, 0));
  const dots = []; for (let c = 0; c < 9; c++) for (let r = 0; r < 5; r++) { const d = ball(.08, '#7f1d1d', -1.05 + c * .26, -.52 + r * .26, .1); d.material = new THREE.MeshStandardMaterial({ color: '#ef4444', emissive: '#ef4444', emissiveIntensity: 0 }); board.add(d); dots.push([d, c, r]); }
  street.add(cyl(.06, .06, 2.2, '#475569', -1.9, 1.1, -.45));
  const bori2 = animal('bear', '#c68642', .8); street.add(bori2);
  const lGo = label('작은 전구가 반짝!', .42, '#fde047'); lGo.position.set(0, 4.5, 0); street.add(lGo);
  const ARROW = ['000010000', '000011000', '111111100', '000011000', '000010000']; // 전광판 화살표

  // ── 상태 ──
  const setMorph = (k, t) => {
    ctx.bg(C_TMP.copy(C_DAY).lerp(C_IN, k));
    fade(play, 1 - k);
    L.grp.visible = true;
    L.up.position.x = lerp(-2.6, 0, k); L.up.scale.x = lerp(1.6 / 5.6, 1, k);
    L.lo.position.x = lerp(2.2, 0, k); L.lo.scale.x = lerp(1.6 / 5.6, 1, k);
    setOpacity(L.up, 1); setOpacity(L.lo, 1);
    fadeShell(clamp((k - .6) / .4, 0, 1));
    L.holes.forEach(h => { const s = clamp((k - .5) * 4, 0, 1); h.visible = s > .01; h.scale.setScalar(Math.max(.01, s)); });
    L.els.forEach((e, i) => { e.position.set(L.xs[i], 2.75, 0); fade(e, i === 0 ? k : clamp((k - .5) * 2, 0, 1)); wobble(e, t + i, .4); });
    L.phs.forEach(p => p.visible = false);
  };
  const ledOn = (t, t0, per) => {
    ctx.bg(C_IN); play.visible = false; fadeShell(1); L.grp.visible = true;
    L.up.position.x = 0; L.up.scale.x = 1; L.lo.position.x = 0; L.lo.scale.x = 1;
    L.els.forEach(e => fade(e, 1)); L.holes.forEach(h => h.scale.setScalar(1));
    return L.run(t, t0, per);
  };
  const morphScene = (t, k) => {
    setMorph(k, t);
    fade(bori, 1 - k); bori.position.set(-2.1, 2.55, 0); bori.rotation.set(0, 0, 0);
    bori.userData.armR.rotation.z = -1 - .4 * Math.sin(t * 6);
    lHi.visible = k < .4; lLo.visible = k < .4; lHi.position.set(-2.6, 3.7, 0); lLo.position.set(2.2, 1.9, 0);
    lUp2.visible = lLo2.visible = k > .7; lUp2.position.set(-.8, 3.85, 0); lLo2.position.set(.8, -.2, .8);
  };

  const draw = (t, ph) => {
    hideAll(lHi, lLo, lPop, lUp2, lLo2, lKong, lShoong);
    LR.grp.visible = LB.grp.visible = street.visible = false;
    play.visible = true; shell.visible = false; bori.visible = false; L.grp.visible = true;
    if (ph === 1) {
      setMorph(0, t); bori.visible = true; setOpacity(bori, 1);
      L.els.forEach(e => e.visible = false); L.holes.forEach(h => h.visible = false);
      const arm = bori.userData.armR;
      if (t < 2) { bori.position.set(-2.1, 2.55, 0); bori.rotation.set(0, 0, 0); arm.rotation.z = -1 - .4 * Math.sin(t * 6); }
      else if (t < 4) { const f = ease((t - 2) / 2); bori.position.set(lerp(-1.8, 1.4, f), lerp(2.6, .97, f), 0); bori.rotation.set(0, 0, -.46); arm.rotation.z = -2.4; lShoong.visible = true; lShoong.position.copy(bori.position).add(V(0, 1.3, 0)); }
      else { const h = t < 4.6 ? Math.sin((t - 4) / .6 * Math.PI) * .35 : 0; bori.position.set(1.9, .95 + h, 0); bori.rotation.set(0, 0, 0); arm.rotation.z = -1.5; }
      lHi.visible = lLo.visible = true; lHi.position.set(-2.6, 3.7, 0); lLo.position.set(2.2, 1.9, 0);
      if (t >= 4 && t < 6.5) { lKong.visible = true; lKong.position.set(1.9, 2.2, 0); }
    } else if (ph === 2) {
      morphScene(t, seg(t, 1.5, 5));

    } else if (ph === 4) {
      ctx.bg(C_IN); play.visible = false; L.grp.visible = false;
      LR.grp.visible = LB.grp.visible = true;
      const tt = t % 6;
      LR.run(tt, 1, 2.6); LB.run(tt, 2.2, 2.6);
    } else if (ph === 5) {
      ctx.bg(C_DAY); play.visible = false; L.grp.visible = false; street.visible = true;
      const on = t < 4 ? 0 : t < 5 ? 1 : 2;
      lamps.forEach((m, i) => { m.material.emissiveIntensity = i === on ? 1.4 : 0; m.material.color.set(i === on ? lampCols[i] : '#334155'); });
      const sh = Math.floor(t * 3) % 9;
      dots.forEach(([d, c, r]) => { const lit = ARROW[4 - r][(c - sh + 9) % 9] === '1'; d.material.emissiveIntensity = lit ? 1.3 : 0; d.material.color.set(lit ? '#ef4444' : '#3f1d1d'); });
      const w = seg(t, 5.4, 9);
      bori2.position.set(lerp(-1.4, 1.4, w), 0, 1 + .0); bori2.rotation.y = w > 0 && w < 1 ? Math.PI / 2 : 0;
      if (w > 0 && w < 1) waddle(bori2, t, 1); else { bori2.userData.body.rotation.z = 0; bori2.userData.body.position.y = 0; }
      lGo.visible = !naming();
    } else { // ph 0: 바뀌는 장면 → 콩! 뿅!
      if (t < 7.5) morphScene(t, seg(t, 1, 4.5));
      else { const i = ledOn(t - 7.5, .8, 1.4); if (i >= 0) { lPop.visible = true; lPop.position.copy(L.phs[i].position).add(V(0, .5, 0)); } }
    }
    if (naming()) hideAll(lHi, lLo, lPop, lUp2, lLo2, lKong, lShoong);
  };
  const ledPt = (x, y) => () => g.localToWorld(V(x, y, 0));
  draw.spots = {
    1: [['🔍 슝 미끄럼틀', [-.2, 1.8, 0], 3.6, '보리가 높은 칸에서 낮은 칸으로 슝!', null, { loop: [1.8, 4.8], slow: .5 }], ['🔍 높은 칸', [-2.6, 2.6, 0], 3]],
    2: [['🔍 바뀌는 보리', L.els[0], 2.6, '보리가 같은 자리에서 하늘색 전자로 바뀌어요', null, { loop: [1.5, 5], slow: .5 }], ['🔍 두 층', [0, 1.6, 0], 5, '파란 위층은 전자 길, 보라 아래층은 빈자리예요']],
    3: [['🔍 콩! 뿅!', ledPt(-2.1, 1.5), 2.8, '전자가 아래층 빈자리로 콩 내려오며 빛이 뿅!', null, { loop: [.8, 3], slow: .5 }], ['🔍 다음 전자', ledPt(-.7, 1.6), 2.8, '또 콩! 또 뿅!', null, { loop: [3, 5.2], slow: .5 }]],
    4: [['🔍 빨간 빛', [-2.0, 1.3, 0], 2.8, '두 층 사이가 낮으면 빨간 빛!', null, { loop: [.8, 3], slow: .5 }], ['🔍 파란 빛', [2.0, 1.9, 0], 3.4, '두 층 사이가 높으면 파란 빛!', null, { loop: [2, 4.2], slow: .5 }]],
    5: [['🔍 반짝 신호등', lamps[2], 2.4, '초록 LED가 반짝!', null, { loop: [4.5, 6.5], slow: .5 }], ['🔍 전광판', board, 2.8, '작은 LED가 줄줄이 반짝!']],
    0: [['🔍 바뀌는 보리', L.els[0], 2.6, '보리가 하늘색 전자로 바뀌어요', null, { loop: [1, 4.5], slow: .5 }], ['🔍 콩! 뿅!', ledPt(-2.1, 1.5), 2.8, '전자가 콩 내려오며 빛이 뿅!', null, { loop: [8.2, 10.2], slow: .5 }]],
  };
  draw.cam = {
    2: [[1.5, 0], [6, -1]],
    3: [[.9, 0], [3.1, 1], [5.4, -1]],
    4: [[.7, 0], [2.0, 1], [3.6, -1]],
    5: [[4.4, 0], [7, -1]],
    0: [[1.2, 0], [5, -1], [8.3, 1], [10.5, -1]],
  };
  return draw;
};

SCENES.q4_qc = (g, ctx) => {
  const naming = () => { try { return mode === 'name'; } catch (e) { return false; } };
  const fade = (o, k) => { o.visible = k > .01; if (o.visible) setOpacity(o, Math.min(1, k)); };
  const GOLD = new THREE.Color('#fbbf24'), GREY = new THREE.Color('#9ca3af'), CY = '#38bdf8', WAVE = new THREE.Color('#60a5fa');
  const ANS = 5; // 정답 순서: 앞(금)·뒤(회)·앞(금)
  const bits = i => [(i >> 2) & 1, (i >> 1) & 1, i & 1];
  const coinGeo = {};
  const coin = (r, on) => { const geo = coinGeo[r] || (coinGeo[r] = new THREE.CylinderGeometry(r, r, r * .22, 24)); const m = new THREE.Mesh(geo, mat(on ? '#fbbf24' : '#9ca3af')); m.rotation.x = Math.PI / 2; return m; };

  // ── 바닥·보리·보물 상자 ──
  const room = new THREE.Group(); g.add(room);
  room.add(floor(11, 5, '#fde7c4'));
  const bori = animal('bear', '#c68642', 1.0); bori.position.set(-3.2, 0, 1.0); bori.rotation.y = .5; room.add(bori);
  const chest = new THREE.Group(); chest.position.set(3.0, 0, .7); g.add(chest);
  chest.add(box(1.1, .6, .75, '#a16207', 0, .3, 0), box(1.12, .08, .77, '#facc15', 0, .45, 0));
  const lid = new THREE.Group(); lid.position.set(0, .6, -.37); chest.add(lid);
  lid.add(box(1.1, .2, .75, '#b45309', 0, .1, .37));
  const glow = ball(.25, emat('#fde047', 1.2), 0, .55, 0); chest.add(glow);
  const setChest = k => { lid.rotation.x = -1.3 * ease(k); glow.visible = k > .3; glow.scale.setScalar(.6 + .6 * ease(k)); };

  // ── 장면 1: 동전 순서 줄 8개 ──
  const wall = new THREE.Group(); room.add(wall);
  wall.add(box(5.6, 3.4, .12, '#fef3c7', -.6, 2.2, -.6));
  const rows = Array.from({ length: 8 }, (_, i) => {
    const r = new THREE.Group(), col = i < 4 ? 0 : 1, rr = i % 4;
    r.position.set(-2.5 + col * 2.6, 3.4 - rr * .7, -.5);
    bits(i).forEach((b, j) => { const c = coin(.24, b); c.position.x = j * .6; r.add(c); });
    const ring = mesh(new THREE.TorusGeometry(.95, .04, 8, 40), '#22c55e', .6, 0, .05); ring.scale.y = .42; r.add(ring); r.userData.ring = ring;
    wall.add(r); return r;

  // ── 장면 2~4: 빙글 동전 → 하늘색 전자 ──
  const P = [-1.5, 0, 1.5], PY = 3.3;
  const big = P.map(x => { const c = coin(.5, 1); c.position.set(x, PY, 0); g.add(c); return c; });
  const els = P.map(x => { const e = critter(.38, CY); e.position.set(x, PY, 0); g.add(e); return e; });
  const rings = P.map(x => { const r = mesh(new THREE.TorusGeometry(.6, .06, 8, 40), '#fbbf24', x, PY, 0); g.add(r); return r; });
  const links = [0, 1].map(i => { const l = line([[P[i] + .6, PY, 0], [P[i + 1] - .6, PY, 0]], '#a78bfa', true); g.add(l); return l; });
  const spinCol = (m, t, i) => m.material.color.copy(GOLD).lerp(GREY, .5 + .5 * Math.sin(t * 14 + i * 2));

  // ── 장면 3: 물결 길 8개와 막대 ──
  const lab = new THREE.Group(); g.add(lab);
  const BX = j => -3.15 + j * .9;
  const bars = Array.from({ length: 8 }, (_, j) => { const b = box(.5, 1, .5, '#60a5fa', BX(j), .5, 0); lab.add(b); return b; });
  Array.from({ length: 8 }, (_, j) => bits(j).forEach((b, k) => { const c = coin(.09, b); c.position.set(BX(j) - .17 + k * .17, .2, .45); lab.add(c); }));
  const dotGeo = new THREE.SphereGeometry(.055, 8, 6), NW = 18;
  const waves = Array.from({ length: 8 }, () => { const m = new THREE.MeshStandardMaterial({ color: '#60a5fa', emissive: '#1e40af', emissiveIntensity: .4 }); return Array.from({ length: NW }, () => { const d = new THREE.Mesh(dotGeo, m); lab.add(d); return d; }); });
  const setWaves = (t, k) => { // k: 0 = 모두 같음, 1 = 틀린 길 잔잔·맞는 길 쑥
    const S = V(0, PY - .6, 0);
    bars.forEach((b, j) => {
      const right = j === ANS, h = right ? lerp(1.2, 2.4, k) : lerp(1.2, .25, k);
      b.scale.y = h; b.position.y = h / 2;
      b.material.color.copy(WAVE).lerp(GOLD, right ? k : 0);
      const E = V(BX(j), h + .15, 0), d = E.clone().sub(S), n = V(-d.y, d.x, 0).normalize();
      const A = right ? lerp(.16, .3, k) : lerp(.16, 0, k);
      waves[j].forEach((dot, q) => { const u = (q + .5) / NW; dot.position.copy(S).addScaledVector(d, u).addScaledVector(n, A * Math.sin(u * 12 - t * 7) * Math.sin(u * Math.PI)); });
      waves[j][0].material.color.copy(WAVE).lerp(GOLD, right ? k : 0);
    });
  };

  // ── 장면 4: 딱 보기 → 바구니 ──
  const meas = new THREE.Group(); g.add(meas);
  const bG = cyl(.62, .45, .5, '#fbbf24', 1.7, .25, .4), bS = cyl(.62, .45, .5, '#9ca3af', -1.7, .25, .4); meas.add(bG, bS);
  const OUT = [5, 5, 5, 2, 5, 5, 5, 5], TM = i => .8 + i * 1.25;
  const drops = OUT.map(o => { const b = ball(.16, o === ANS ? '#fbbf24' : '#9ca3af'); meas.add(b); return b; });
  const burst = mesh(new THREE.TorusGeometry(1, .04, 8, 48), emat('#fde047', 1), 0, PY, 0); meas.add(burst);
  const setMeasure = t => {
    let shown = -1, nG = 0, nS = 0;
    OUT.forEach((o, i) => {
      const a = clamp((t - TM(i)) / .6, 0, 1), b = drops[i];
      if (t >= TM(i) && t < TM(i) + 1.05) shown = i;
      const n = o === ANS ? nG++ : nS++, bx = o === ANS ? 1.7 : -1.7;

  };

  const lA = label('하나씩 8가지?', .42, '#fde047'), lB = label('딱 맞아!', .5, '#86efac');
  const lC = label('● 빙글 동전 = 하늘색 전자', .38, '#7dd3fc'), lD = label('틀린 길은 잔잔', .4, '#93c5fd'), lE = label('맞는 길은 쑥!', .45, '#fde047');
  const lF = label('맞는 답이 자주!', .45, '#fde047');
  g.add(lA, lB, lC, lD, lE, lF);

  const morph = (t, k) => { // 빙글 동전 → 하늘색 전자
    big.forEach((c, i) => { fade(c, 1 - k); c.rotation.z = t * 10 + i; spinCol(c, t, i); });
    els.forEach((e, i) => { fade(e, k); wobble(e, t + i, .5); });
    rings.forEach((r, i) => { fade(r, k); spinCol(r, t, i); r.rotation.y = t * 4 + i; });
    lC.visible = k > .3; lC.position.set(0, PY + 1.1, 0);
  };

  const draw = (t, ph) => {
    hideAll(lA, lB, lC, lD, lE, lF, ...links);
    ctx.bg(BOOK.sceneBg);
    room.visible = true; wall.visible = false; lab.visible = false; meas.visible = false; chest.visible = true; setChest(0);
    big.forEach(c => c.visible = false); els.forEach(e => e.visible = false); rings.forEach(r => r.visible = false);
    setOpacity(room, 1);
    if (ph === 1) {
      wall.visible = true; setOpacity(wall, 1);
      const found = 0.8 + ANS * 1.0;
      rows.forEach((r, i) => {
        const ta = .8 + i * 1.0; r.visible = t >= ta && i <= ANS;
        r.scale.setScalar(clamp((t - ta) / .3, .01, 1)); r.userData.ring.visible = i === ANS && t >= found + .3;
      });
      setChest(seg(t, found + .3, found + 1.2));
      bori.userData.armR.rotation.z = -1 - .5 * Math.abs(Math.sin(t * 3));
      lA.visible = t < found; lA.position.set(-.6, 4.4, 0);
      lB.visible = t >= found + .3; lB.position.set(3.0, 1.9, .7);

      lF.visible = t > 6; lF.position.set(0, 4.5, 0); if (lF.visible) lC.visible = false;

        const u = t - 6.5; lab.visible = true; chest.visible = false;

  draw.spots = {

    2: [['🔍 빙글 동전', [0, PY, 0], 2.6, '빙글 도는 동안은 앞도 뒤도 함께예요', null, { loop: [2, 4], slow: .5 }], ['🔍 바뀌는 동전', [0, PY, 0], 3.6, '동전이 같은 자리에서 하늘색 전자로 바뀌어요', null, { loop: [3.8, 7.2], slow: .5 }]],
    3: [['🔍 잔잔해지는 길', [-1.35, 1.4, 0], 3.2, '틀린 길 물결은 서로 지워져 잔잔해져요', null, { loop: [4, 8], slow: .5 }], ['🔍 쑥 커지는 길', [BX(ANS), 1.8, 0], 3.2, '맞는 길 물결은 겹쳐서 쑥 커져요', null, { loop: [4, 8], slow: .5 }]],
    4: [['🔍 딱 보기', elMid, 3, '보는 순간 답 하나가 정해져요', null, { loop: [.6, 2.2], slow: .5 }], ['🔍 금색 바구니', [1.7, .8, .4], 2.8, '맞는 답이 자주 모여요', null, { loop: [6, 9.6], slow: .5 }]],
    0: [['🔍 바뀌는 동전', [0, PY, 0], 3.6, '빙글 동전이 하늘색 전자로 바뀌어요', null, { loop: [1, 4.2], slow: .5 }], ['🔍 쑥 커지는 길', [BX(ANS), 1.8, 0], 3.2, '맞는 길 물결은 쑥 커져요', null, { loop: [8, 12], slow: .5 }]],

    1: [[5.6, 1], [8.2, -1]],
    2: [[1.2, 0], [3.8, 1], [7.6, -1]],
    3: [[4.2, 0], [6.4, 1], [9, -1]],
    4: [[.6, 0], [2.4, -1], [8, 1], [10.4, -1]],
    0: [[1.2, 0], [4.6, -1], [9.5, 1], [12.5, -1]],

let segLoop = null, segSi = 0, autoCam = true, camKey = -9; // 확대 구간 반복, 자동 카메라
const SPEEDS = [[1, '🐇 보통'], [.5, '🐢 느리게'], [.25, '🐌 아주 느리게']]; let si = 0;
function setSpeedIdx(i) { si = i; speed = SPEEDS[si][0]; $('#speedBtn').textContent = SPEEDS[si][1]; $('#speedBtn').setAttribute('aria-pressed', si > 0); }
function endLoop() { if (segLoop) { segLoop = null; setSpeedIdx(segSi); } }
const clock = new THREE.Clock(), solved = new Set();
const phaseT = () => phase === 0 ? LESSONS[cur].T : LESSONS[cur].watch[phase - 1][1];
const fmt = s => `${Math.floor(s)}초`;

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .1);
  if (playing && !seeking) {
    tPlay += dt * speed;
    if (segLoop) { if (tPlay > segLoop[1] || tPlay < segLoop[0]) tPlay = segLoop[0]; }
    else tPlay %= phaseT();
  }
  runCam();
  controls.update(dt);
  if (draw) draw(tPlay, phase);
  if (!seeking) $('#seek').value = Math.round(tPlay / phaseT() * 1000);
  $('#ptime').textContent = fmt(tPlay);
  if (nameSprite) { const k = pulse(clock.elapsedTime * .7), [w, h] = nameSprite.userData.base; nameSprite.scale.set(w * k, h * k, 1); }
  renderer.render(scene, camera);
});

// ── 자동 카메라: draw.cam = { 2: [[초, 돋보기번호 | -1(전체)], ...] } → 큰 움직임을 보다가 정해진 순간에 다가가 작은 움직임을 보여 줘요 ──
function runCam() {
  const keys = draw?.cam?.[phase]; if (!keys || !autoCam || segLoop) return;
  let k = -1; keys.forEach((c, i) => { if (c[0] <= tPlay) k = i; });
  if (k === camKey) return;
  const prev = camKey; camKey = k;
  if (k === -1) { if (prev !== -9) home(.9); return; }
  if (keys[k][1] < 0) home(1); else zoomSpot(keys[k][1], true);
}
function home(dur = 0) {
  const L = LESSONS[cur], [x, y, z] = L.cam || [0, 1.5, 9], [tx, ty, tz] = L.tgt || [0, 0, 0];
  const k = Math.max(1, (L.fit || 1.35) / camera.aspect); // 좁은 화면이면 뒤로 물러나 전체가 보이게
  const off = V(x - tx, y - ty, z - tz).multiplyScalar(k), sph = new THREE.Spherical().setFromVector3(off);
  zoomed = -1; renderSpots();
  if (!dur) { controls.anim = null; controls.follow = null; controls.target.set(tx, ty, tz); camera.position.copy(controls.target).add(off); controls.sync(); return; }
  controls.goTo(V(tx, ty, tz), sph.radius, dur, [sph.theta, sph.phi]); controls.follow = null;
}

// ── 돋보기 칩: 장면 함수가 draw.spots = { 0:[...], 1:[...] } 로 정해 줘요 ──
//  한 칸: ['🔍 이름', 위치([x,y,z] | Object3D | ()=>Vector3), 거리, 설명(선택), 보는 각도 [theta, phi](선택, phi: 위에서 0 · 옆 1.57 · 아래 3.14)]
const spotsOf = () => (draw?.spots && (draw.spots[phase] || draw.spots.all)) || [];
function renderSpots() {
  const list = spotsOf(), box = $('#spots');
  box.replaceChildren(...list.map((s, i) => {
    const b = document.createElement('button'); b.textContent = s[0] + (zoomed === i && segLoop ? ' 🔁' : ''); b.className = zoomed === i ? 'on' : '';
    b.onclick = () => zoomSpot(i); return b;
  }), ...(list.length ? [Object.assign(document.createElement('button'), { className: 'all', textContent: '🌍 전체', onclick: () => { autoCam = false; endLoop(); home(.7); } })] : []));
}
//  6번째 칸(선택) { loop:[시작초, 끝초], slow:.5 } → 누르면 그 작은 움직임만 크게, 느리게 계속 되풀이 (🌍 전체 / ⏮ / 되감기 막대로 풀림)
function zoomSpot(i, auto = false) {
  const s = spotsOf()[i]; if (!s) return;
  const o = s[5] || {};
  if (!auto) {
    autoCam = false;
    if (o.loop) { if (!segLoop) segSi = si; segLoop = o.loop; tPlay = o.loop[0]; setPlaying(true); if (o.slow) setSpeedIdx(Math.max(0, SPEEDS.findIndex(x => x[0] === o.slow))); }
    else endLoop();
  }
  zoomed = i; renderSpots();
  const to = Array.isArray(s[1]) ? V(...s[1]).applyMatrix4(group.matrixWorld) : s[1];
  controls.goTo(to, (s[2] || 2.5) * Math.max(1, 1.15 / camera.aspect), .8, s[4] || null);
  $('#hint').style.opacity = 0;
  if (s[3] && !auto) { toast((o.loop ? '🔁 ' : '🔍 ') + s[3]); say(s[3]); }
}
controls.onUser = () => { $('#hint').style.opacity = 0; autoCam = false; };

// ── 영상 조작 ──
function setPlaying(v) { playing = v; $('#playBtn').textContent = v ? '⏸' : '▶'; $('#playBtn').setAttribute('aria-label', v ? '멈춤' : '재생'); }
$('#playBtn').onclick = () => setPlaying(!playing);
$('#restartBtn').onclick = () => {
  setPlaying(true);
  if (segLoop) { tPlay = segLoop[0]; return; }   // 확대 반복 중이면 그 구간 처음으로
  tPlay = 0; autoCam = true; camKey = -9; home(.6);
};
$('#speedBtn').onclick = () => { setSpeedIdx((si + 1) % SPEEDS.length); if (segLoop) segSi = si; };
const seek = $('#seek');
seek.addEventListener('input', () => { seeking = true; endLoop(); autoCam = false; tPlay = seek.value / 1000 * phaseT() * .999; });
seek.addEventListener('change', () => { seeking = false; });
seek.addEventListener('pointerup', () => { seeking = false; });
function startPhase(ph) {
  endLoop(); phase = ph; tPlay = 0; setPlaying(true); home(.6); autoCam = true; camKey = -9; renderSpots();
}

// ── 읽어 주기 ──
let voice = false;
const plain = s => s.replace(/\p{Extended_Pictographic}|️/gu, '').trim();
function say(text) {
  if (!voice || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(plain(text)); u.lang = 'ko-KR'; u.rate = .9; speechSynthesis.speak(u);
}
// 받침 유무에 따라 "이라고/라고" (영어·숫자 이름도 읽는 소리로 판단)
function irago(w) {
  const ch = w.trim().slice(-1), c = ch.charCodeAt(0);
  if (c >= 0xAC00 && c <= 0xD7A3) return (c - 0xAC00) % 28 ? '이라고' : '라고';
  if (/[LMNRlmnr]/.test(ch) || /[013678]/.test(ch)) return '이라고';
  return '라고';
}

// ── 화면 ──
const dots = $('#dots');
LESSONS.forEach((L, i) => { const b = document.createElement('button'); b.setAttribute('aria-label', `${i + 1}. ${L.law}`); b.onclick = () => show(i); dots.append(b); });
function refreshDots() {
  [...dots.children].forEach((b, i) => { b.textContent = solved.has(i) ? '⭐' : i + 1; b.classList.toggle('on', i === cur); b.setAttribute('aria-current', i === cur); });
  $('#stars').textContent = `⭐ ${solved.size} / ${LESSONS.length}`;
}
function setMode(m) {
  mode = m; for (const id of ['watch', 'quiz', 'name']) $('#' + id).classList.toggle('on', id === m);
  if (nameSprite) { camera.remove(nameSprite); nameSprite = null; }
}

function show(i) {
  cur = i; const L = LESSONS[i];
  if (group) { scene.remove(group); group.traverse(o => { o.geometry?.dispose(); o.material?.map?.dispose(); o.material?.dispose?.(); }); }
  scene.background.copy(BG); hemi.intensity = 1.5; sun.intensity = 1.5;
  group = new THREE.Group(); scene.add(group);
  globalThis.LABEL_K = Math.max(1, (L.fit || 1.35) / camera.aspect) ** .85;
  draw = SCENES[L.scene](group, ctx);
  $('#badge').textContent = `${i + 1}. ${L.law}`;
  $('#title').textContent = L.title;
  $('#prevBtn').disabled = i === 0;
  $('#nextBtn').textContent = i === LESSONS.length - 1 ? '처음으로 ▶' : '다음 ▶';
  $('#nextBtn').classList.remove('go');
  refreshDots();
  wstep = 0; setMode('watch'); phase = 1; home(0); renderWatch();
}

// ① 보기: 장면마다 한 줄 + 반복 재생 애니메이션
function renderWatch() {
  const L = LESSONS[cur], n = L.watch.length, [text, , look] = L.watch[wstep];
  $('#wdots').replaceChildren(...[...L.watch.map((_, i) => { const d = document.createElement('span'); d.className = i < wstep ? 'done' : i === wstep ? 'on' : ''; return d; }),
    Object.assign(document.createElement('span'), { className: 'q' }), Object.assign(document.createElement('em'), { textContent: `장면 ${wstep + 1} / ${n}` })]);
  $('#story').textContent = wstep === 0 ? L.story : '';
  $('#story').hidden = wstep !== 0;
  $('#wtext').textContent = text;
  startPhase(wstep + 1);
  const sp = spotsOf();
  const lp = sp.find(s => s[5]?.loop) || sp[0];
  $('#look').textContent = look || (lp ? (lp[5]?.loop ? `🔍 「${lp[0].replace(/^🔍\s*/, '')}」를 누르면 작은 움직임만 크게, 천천히 되풀이해요!` : `🔍 위의 「${lp[0].replace(/^🔍\s*/, '')}」 돋보기를 눌러 크게 봐요!`) : '⏮ 버튼으로 몇 번이고 다시 볼 수 있어요.');
  $('#wprevBtn').disabled = wstep === 0;
  $('#wnextBtn').textContent = wstep === n - 1 ? '✏️ 문제 풀기 ▶' : '다음 장면 ▶';
  say((wstep === 0 ? L.story + ' ' : '') + text);
}
$('#wprevBtn').onclick = () => { if (wstep > 0) { wstep--; renderWatch(); } };
$('#wnextBtn').onclick = () => {
  if (wstep < LESSONS[cur].watch.length - 1) { wstep++; renderWatch(); return; }
  startQuiz();
};

// ② 문제
let qstep = 0, order = [0, 1, 2];
function startQuiz() {
  setMode('quiz'); qstep = solved.has(cur) ? 0 : 0; $('#feedback').hidden = true; startPhase(0); renderQ(); readQ();
}
const readQ = () => { const L = LESSONS[cur], [q, ch] = qstep === 0 ? [L.q, L.choices] : [L.q2, L.choices2]; say(`${q} ${order.map((k, i) => `${i + 1}번, ${ch[k][1]}`).join(' ')}`); };
function renderQ() {
  const L = LESSONS[cur], [q, ch] = qstep === 0 ? [L.q, L.choices] : [L.q2, L.choices2];
  order = [0, 1, 2].sort(() => Math.random() - .5);
  $('#st1').className = qstep === 0 ? 'on' : 'done'; $('#st2').className = qstep === 1 ? 'on' : '';
  $('#q').textContent = q; $('#tip').textContent = '';
  $('#choices').replaceChildren(...order.map(k => {
    const [e, t] = ch[k], b = document.createElement('button'), em = document.createElement('span');
    em.className = 'emo'; em.textContent = e; em.setAttribute('aria-hidden', 'true'); b.append(em, t); b.onclick = () => pick(k, b); return b;
  }));
}
function pick(k, b) {
  const L = LESSONS[cur], ans = qstep === 0 ? L.answer : L.answer2, hint = qstep === 0 ? L.hint : L.hint2;
  if (k !== ans) { b.classList.add('wrong'); b.disabled = true; $('#tip').textContent = `🤔 다시 생각해 볼까요? ${hint}`; say(`다시 생각해 볼까요? ${hint}`); return; }
  [...$('#choices').children].forEach(x => x.disabled = true); b.classList.add('right');
  if (qstep === 0) { qstep = 1; $('#tip').textContent = '👍 맞아요! 그럼 왜 그럴까요?'; say('맞아요! 그럼 왜 그럴까요?'); setTimeout(() => { renderQ(); readQ(); }, 700); return; }
  $('#st2').className = 'done'; $('#tip').textContent = '';
  $('#kid').textContent = `"${L.kid}"`; $('#feedback').hidden = false;
  solved.add(cur); refreshDots(); say(`딩동댕! 둘 다 맞았어요. ${L.kid}`);
  if (solved.size === LESSONS.length) toast(`🏆 ${LESSONS.length}개를 모두 풀었어요! ${BOOK.champion} 탄생!`);
}
$('#rewatchBtn').onclick = () => { wstep = 0; setMode('watch'); renderWatch(); };

// ③ 이름표
$('#nameBtn').onclick = () => {
  // 큰 이름은 언제나 진짜 과학 이름. name.kid 가 있으면 아래에 작게 '쉬운 말' (7세판)
  const L = LESSONS[cur], term = L.name.term, jo = L.name.josa || irago(term), formal = L.name.kid || '';
  setMode('name'); startPhase(0);
  $('#ntext').replaceChildren('이걸 ', Object.assign(document.createElement('span'), { className: 'term', textContent: term }), ` ${jo} 해요!`.replace(' ' + jo, jo), ...(formal ? [Object.assign(document.createElement('span'), { className: 'formal', textContent: '쉬운 말로는 · ' + formal })] : []));
  $('#nsub').replaceChildren(L.name.what, ...(L.habit ? [Object.assign(document.createElement('span'), { className: 'habit', textContent: '🏠 생활 습관 · ' + L.habit })] : []));
  renderAdult(L.adult);
  nameSprite = label(term, .34, '#fde047'); nameSprite.position.set(0, .95, -3.2);
  const maxW = 2.2 * camera.aspect; if (nameSprite.userData.base[0] > maxW) { const r = maxW / nameSprite.userData.base[0]; nameSprite.userData.base = nameSprite.userData.base.map(v => v * r); }
  camera.add(nameSprite);
  $('#nnextBtn').textContent = cur === LESSONS.length - 1 ? '처음으로 ▶' : '다음 이야기 ▶';
  $('#nextBtn').classList.add('go');
  say(`이걸 ${term}${jo} 해요! ${formal ? '쉬운 말로는 ' + formal + '. ' : ''}${L.name.what} ${L.habit ? '생활 습관. ' + L.habit : ''}`);
};
$('#againBtn').onclick = () => { wstep = 0; setMode('watch'); renderWatch(); };
$('#nnextBtn').onclick = () => show((cur + 1) % LESSONS.length);

// ── 어른용 상자: 핵심 한 줄 + 알아둘 조건 + 생활 속에서 + 접히는 더 알아보기 ──
//  adult 가 객체면 { core, cond:[...], life, map, more }, 문자열이면 첫 문장 = 핵심, (비유: …) = 그림 속 짝, 나머지 = 더 알아보기
function renderAdult(a) {
  const box = $('#adult'); box.replaceChildren(); if (!a) return;
  let o = a;
  if (typeof a === 'string') {
    let s = a.replace(/^어른용\s*·\s*/, '').trim(), map = '';
    s = s.replace(/\(비유:\s*([^)]*)\)/, (_, m) => { map = m; return ''; }).replace(/\s+\./g, '.').replace(/\s{2,}/g, ' ');
    const parts = s.split(/(?<=다\.|요\.|\)\.)\s+/);
    o = { core: parts[0], map, more: parts.slice(1).join(' ') };
  }
  const el = (tag, cls, txt) => Object.assign(document.createElement(tag), { className: cls || '', textContent: txt || '' });
  const head = (t) => el('b', 'ad-h', t);
  const core = el('div', 'ad-core'); core.append(head('어른용 · 핵심 '), o.core || ''); box.append(core);
  if (o.cond?.length) { const d = el('div', 'ad-cond'); d.append(head('알아둘 조건')); const ul = el('ul'); (Array.isArray(o.cond) ? o.cond : [o.cond]).forEach(c => ul.append(el('li', '', c))); d.append(ul); box.append(d); }
  if (o.life) { const d = el('div', 'ad-life'); d.append(head('생활 속에서 '), o.life); box.append(d); }
  if (o.map || o.more) {
    const det = document.createElement('details'); det.append(el('summary', '', '더 알아보기'));
    if (o.map) { const p = el('div', 'ad-map'); p.append(head('그림 속 짝 '), o.map); det.append(p); }
    if (o.more) det.append(el('div', 'ad-more', o.more));
    box.append(det);
  }
}
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toast.id); toast.id = setTimeout(() => el.hidden = true, 3200); }
$('#prevBtn').onclick = () => cur > 0 && show(cur - 1);
$('#nextBtn').onclick = () => show((cur + 1) % LESSONS.length);
$('#homeBtn').onclick = () => { autoCam = false; endLoop(); home(.6); };
$('#voiceBtn').onclick = e => {
  voice = !voice; e.currentTarget.setAttribute('aria-pressed', voice);
  if (voice) { if (mode === 'watch') say(LESSONS[cur].watch[wstep][0]); else if (mode === 'quiz') readQ(); else say(`이걸 ${LESSONS[cur].name.term}${LESSONS[cur].name.josa || irago(LESSONS[cur].name.term)} 해요! ${LESSONS[cur].name.what}`); }
  else window.speechSynthesis?.cancel();
};

// 글꼴(Jua)을 먼저 받아야 3D 글자가 예쁘게 나와요 (글자 조각별로 내려받는 구글 폰트 대응)
const allText = JSON.stringify(LESSONS) + Object.values(SCENES).map(f => f.toString()).join('') + '0123456789';
Promise.race([document.fonts?.load?.("78px Jua", allText) || Promise.resolve(), new Promise(r => setTimeout(r, 2500))]).catch(() => {}).then(() => show(0));

</script>
<script>
/* kids-sfx v1: short synthesized sounds for scene / next buttons (Web Audio, no files, offline-safe) */
(() => {
  try {
    const FWD = ['nextBtn', 'lnextBtn', 'pnextBtn', 'wnextBtn', 'nnextBtn', 'learnBtn', 'nameBtn'];
    const BACK = ['prevBtn', 'wprevBtn', 'replayBtn', 'preplayBtn', 'rewatchBtn', 'retellBtn', 'againBtn'];
    let ctx = null;
    const tone = (f0, f1, at, dur, type, vol) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f0, at);
      o.frequency.exponentialRampToValueAtTime(f1, at + dur);
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(vol, at + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(at); o.stop(at + dur + 0.02);
    };
    const play = kind => {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        if (!ctx) ctx = new AC();
        if (ctx.state === 'suspended') ctx.resume();
        const t = ctx.currentTime + 0.01;
        if (kind === 'fwd') { tone(523, 784, t, 0.07, 'sine', 0.16); tone(784, 1175, t + 0.06, 0.09, 'sine', 0.13); }
        else if (kind === 'back') { tone(784, 523, t, 0.11, 'sine', 0.14); }
        else { tone(660, 990, t, 0.08, 'triangle', 0.15); }
        const h = document.documentElement;
        h.dataset.sfx = String((+h.dataset.sfx || 0) + 1);
        h.dataset.sfxLast = kind;
      } catch (e) {}
    };
    document.addEventListener('click', e => {
      const b = e.target && e.target.closest ? e.target.closest('button') : null;
      if (!b || b.disabled) return;
      if (FWD.includes(b.id)) play('fwd');
      else if (BACK.includes(b.id)) play('back');
      else if (b.parentElement && b.parentElement.id === 'dots') play('dot');
    }, true);
  } catch (e) {}
})();
</script>
