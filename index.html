<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>양자물리 놀이터</title>
<meta property="og:title" content="⚛️ 양자물리 놀이터">
<meta property="og:description" content="움직이는 3D 영상으로 보는 원자 세상: 원자, 분자, 별과 땅속과 플라스틱의 원자">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#eef4ff;color:#23324a;font-family:'Jua',system-ui,'Malgun Gothic',sans-serif;display:flex;flex-direction:column;align-items:center;padding:28px 16px}
h1{margin:0;font-size:36px;font-weight:400}
.sub{margin:8px 0 26px;font-size:19px;color:#5b6b82;text-align:center;line-height:1.5}
.books{display:grid;gap:18px;width:100%;max-width:880px}
@media(min-width:760px){.books{grid-template-columns:1fr 1fr}}
a.book{display:flex;flex-direction:column;gap:10px;background:#fff;border-radius:28px;padding:24px;text-decoration:none;color:inherit;box-shadow:0 6px 0 #0000000f;border:3px solid transparent;transition:transform .12s,border-color .12s}
a.book:hover,a.book:focus-visible{transform:translateY(-3px);border-color:#2563eb;outline:none}
.tag{align-self:flex-start;background:#1d4ed8;color:#fff;padding:4px 14px;border-radius:999px;font-size:16px}
.book h2{margin:0;font-size:30px;font-weight:400}
.book p{margin:0;font-size:18px;color:#5b6b82;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:#f1f5f9;border-radius:999px;padding:4px 10px;font-size:15px}
.go{margin-top:6px;align-self:flex-start;background:#2563eb;color:#fff;border-radius:16px;padding:10px 18px;font-size:20px;box-shadow:0 4px 0 #3a3ab5}
.foot{margin-top:26px;font-size:15px;color:#8a97ab;text-align:center;line-height:1.6}
</style>
</head>
<body>
<h1>⚛️ 양자물리 놀이터</h1>
<p class="sub">영상을 보고 → 문제를 풀고 → 과학 이름까지!<br>눈에 안 보이는 원자 세상을 크게, 느리게 봐요.</p>
<div class="books">
  <a class="book" href="book1.html">
    <span class="tag">첫째 권</span>
    <h2>⚛️ 원자 세상</h2>
    <p>쪼개고 또 쪼개면? 원자 속, 원자의 종류, 분자, 우주와 땅속과 플라스틱 속 원자까지 10가지 영상 이야기.</p>
    <div class="chips"><span>원자</span><span>원자핵</span><span>원소</span><span>분자</span><span>핵융합</span><span>초신성</span><span>규소</span><span>고분자</span><span>열운동</span><span>전자구름</span></div>
    <span class="go">시작하기 ▶</span>
  </a>
</div>
<p class="foot">폰에서는 카톡 미리보기 대신 크롬이나 사파리로 열면 가장 잘 보여요.<br>⏸ 멈춤 · ⏮ 처음부터 · 🐢 느리게 · 🔍 돋보기로 몇 번이고 다시 볼 수 있어요.<br>🔊 읽어 주기 버튼을 누르면 소리로 읽어 줘요.</p>
</body>
</html>
